<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style id="no-flash">html, body { background: var(--app-bg, #1B2133); color: #fff; } body { animation: lgfade .25s ease-out; } @keyframes lgfade { from { opacity: 0; } }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Мої партії</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1791477054">
  <link rel="stylesheet" href="../shared/play.css?v=1791477054">
  <style>
    body { margin: 0; font-family: Manrope, var(--lg-font), sans-serif; }
    .gm { box-sizing: border-box; padding: calc(6px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; height: calc(100svh - var(--fs-top, 0px)); overflow: hidden; }
    .gm > * { width: min(100%, 520px); flex: none; }
    /* дошка — стільки, скільки лишається від висоти екрана: усі кнопки видно без прокрутки */
    .gm-nav button, .gm-an, .gm-ret, .gm-play { min-height: 40px !important; }
    .gm-info { font-size: 14px; padding: 8px 12px; }
    .gm-top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .gm-top b { text-align: center; font-size: 20px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gm-more { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.08); color: #fff; font: 800 22px/1 sans-serif; cursor: pointer; }
    html.lg-tg .gm-top::before { content: ''; width: 40px; flex: none; }
    .gm-sheet { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: end center; background: rgba(0,0,0,.55); padding: 0 12px calc(16px + env(safe-area-inset-bottom)); }
    .gm-sheet-card { width: min(100%, 460px); box-sizing: border-box; padding: 18px 16px 14px; border-radius: 20px; background: #262d45; display: flex; flex-direction: column; gap: 12px; }
    .gm-sheet-card b { font-size: 18px; }
    .gm-sheet-card small { color: #9fb0d8; font-weight: 600; font-size: 14px; }
    .gm-lines { display: flex; gap: 8px; }
    .gm-lines button { flex: 1; min-height: 48px; border: 0; border-radius: 14px; background: rgba(255,255,255,.08); color: #fff; font: 800 20px Manrope, sans-serif; }
    .gm-lines button.on { background: #2ee6b8; color: #04241d; }
    .gm-close { min-height: 46px; border: 0; border-radius: 14px; background: #7C6CF0; color: #fff; font: 800 16px Manrope, sans-serif; }
    .gm-back { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: #fff; font: 700 28px/1 sans-serif; text-decoration: none; }
    html.lg-tg .gm-back { display: none; }
    html.lg-tg .gm-top b { text-align: center; }
    .gm-list { display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.04); }
    .gm-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.07); }
    .gm-row:last-child { border-bottom: 0; }
    .gm-row img { flex: none; width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: #2a3150; }
    .gm-row span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .gm-row b { font-size: 16px; font-weight: 800; }
    .gm-row small { font-size: 13px; font-weight: 700; color: #8e99b8; }
    .gm-res { flex: none; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
    .gm-res.w { background: #1f7a3a; } .gm-res.d { background: #54607f; } .gm-res.l { background: #a8322a; }
    .gm-empty { text-align: center; color: #9fb0d8; font-weight: 700; padding: 40px 10px; line-height: 1.5; }
    /* дошка — від краю до краю екрана (виходить за бічні відступи сторінки) */
    .gm > .gm-board-row { width: min(100vw, 520px); display: flex; flex-direction: column; gap: 4px; }
    /* шкала оцінки — тонка смужка під дошкою (вмикається в ⋯): білим — перевага білих */
    .gm-eval { height: 8px; margin: 0 8px; border-radius: 4px; overflow: hidden; background: #2b2b2b; display: flex; }
    .gm-eval i { display: block; background: #f2f2f2; transition: width .4s; width: 50%; }
    .gm-eval.flip { transform: scaleX(-1); }
    .gm-eval[hidden] { display: none; }
    .gm-board { width: 100%; }
    .gm-sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 14px; background: rgba(255,255,255,.08); color: #fff; font: 800 16px Manrope, sans-serif; text-align: left; }
    .gm-sw i { flex: none; width: 44px; height: 26px; border-radius: 13px; background: #54607f; position: relative; transition: background .2s; }
    .gm-sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .gm-sw.on i { background: #2ee6b8; } .gm-sw.on i::after { transform: translateX(18px); }
    .gm-acts { display: flex; gap: 8px; }
    .gm-acts > * { flex: 1; min-width: 0; }
    /* мало місця — спершу менші кнопки, а вже потім менша дошка */
    .gm.tight { gap: 5px; }
    .gm.tight .gm-nav button, .gm.tight .gm-an, .gm.tight .gm-play, .gm.tight .gm-ret { min-height: 36px !important; font-size: 15px; }
    .gm.tight .gm-top { min-height: 36px; }
    .gm.tight .gm-back, .gm.tight .gm-more { width: 34px; height: 34px; }
    .gm-board .lg-board-el { width: 100%; aspect-ratio: 1; }
    .gm-nav { display: flex; align-items: center; gap: 6px; }
    .gm-nav button { flex: 1; min-height: 46px; border: 0; border-radius: 14px; background: rgba(255,255,255,.08); color: #fff; font: 800 20px Manrope, sans-serif; cursor: pointer; }
    .gm-nav button:disabled { opacity: .35; }
    .gm-nav .gm-n { flex: 1.6; text-align: center; font-weight: 800; font-size: 14px; white-space: nowrap; color: #c9d2ea; }
    .gm-slider { width: 100%; accent-color: #2ee6b8; }
    .gm-an { min-height: 46px; border: 0; border-radius: 14px; background: #7C6CF0; color: #fff; font: 800 16px Manrope, sans-serif; cursor: pointer; }
    .gm-an.on { background: #2ee6b8; color: #04241d; }
    .gm-info { min-height: 44px; padding: 10px 14px; box-sizing: border-box; border-radius: 14px; background: rgba(255,255,255,.05); font-weight: 700; font-size: 15px; color: #dfe5f5; line-height: 1.4; }
    .gm-info[hidden] { display: none; }
    .gm-info small { display: block; color: #8e99b8; font-size: 13px; }
    .gm-ret { min-height: 44px; border: 0; border-radius: 14px; background: #FF9F1C; color: #1b1300; font: 800 16px Manrope, sans-serif; cursor: pointer; }
    .gm-ret[hidden], .gm-slider[hidden], .gm-n[hidden] { display: none; }
    .gm-nav .gm-ret { flex: 1.6; min-height: 46px; background: #FF9F1C; color: #1b1300; padding: 0 6px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gm-play { display: grid; place-items: center; min-height: 46px; border-radius: 14px; background: #2ee6b8; color: #04241d; font: 800 16px Manrope, sans-serif; text-decoration: none; }
  </style>
</head>

</html>
