<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style id="no-flash">html, body { background: #1B2133; color: #fff; } body { animation: lgfade .25s ease-out; } @keyframes lgfade { from { opacity: 0; } }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Шахові задачі</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790412596">
  <link rel="stylesheet" href="../shared/play.css?v=1790412596">
  <style>
    .mt { justify-content: center; gap: 8px; }
    .mt-goal { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; font: 900 16px var(--lg-font); color: var(--lg-ink); min-height: 30px; text-align: center; }
    .mt-count:empty { display: none; }
    .mt[data-mode="puzzle"]:not([data-lesson]) .mt-navrow .mt-count { cursor: pointer; border-bottom: 2px dotted rgba(255,255,255,.5); border-radius: 0; }
    .pk { position: fixed; left: 0; right: 0; bottom: 0; top: var(--fs-top, 0px); z-index: 2500; background: #1B2133; color: #fff; overflow-y: auto; padding: calc(8px + var(--tg-top, 0px) + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; font-family: Manrope, var(--lg-font), sans-serif; }
    .pk > * { max-width: 560px; margin-left: auto; margin-right: auto; }
    .pk-top { display: flex; align-items: center; gap: 8px; min-height: 52px; }
    .pk-top b { font: 800 22px Manrope, sans-serif; }
    .pk-back { width: 44px; height: 44px; border: 0; background: none; color: #fff; font: 700 34px/1 sans-serif; cursor: pointer; }
    .pk-head { display: flex; gap: 16px; align-items: center; padding: 10px 0 16px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .pk-mini { flex: none; width: 42%; max-width: 200px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); border-radius: 6px; overflow: hidden; }
    .pk-mini i { background: #f0d9b5; position: relative; }
    .pk-mini i.d { background: #b58863; }
    .pk-mini img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pk-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; font-weight: 700; font-size: 15px; color: #c9d2ea; }
    .pk-info b { color: #fff; }
    .pk-bar { display: inline-block; vertical-align: middle; width: 70px; height: 9px; border-radius: 9px; background: rgba(255,255,255,.15); overflow: hidden; }
    .pk-bar span { display: block; height: 100%; background: #9be15d; border-radius: 9px; }
    .pk-note { font-size: 13px; color: #8e99b8; }
    .pk-go { margin-top: 4px; min-height: 46px; border: 0; border-radius: 14px; background: #2ee6b8; color: #04241d; font: 800 16px Manrope, sans-serif; box-shadow: 0 4px 0 #1a9c7c; cursor: pointer; }
    .pk-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 14px 0 10px; font-size: 13px; font-weight: 700; color: #9fb0d8; }
    .pk-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
    .pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
    .pk-grid button { aspect-ratio: 1; border: 0; border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; font: 800 20px Manrope, sans-serif; cursor: pointer; }
    .pk .g { background: #1f7a3a; } .pk .y { background: #f39c12; } .pk .r { background: #c0392b; }
    .pk-grid button.cur { box-shadow: 0 0 0 3px #fff inset; }
    body:has(.pk) .lg-nav { display: none !important; }
    .mt-lives { letter-spacing: 2px; font-size: 15px; }
    .mt-count { padding: 3px 10px; border-radius: 999px; background: var(--lg-surface); border: 2px solid var(--lg-line); font-size: 14px; }
    .mt-side { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #1d1b30; background: #fff; vertical-align: -2px; box-sizing: border-box; }
    .mt-side.b { background: #1d1b30; border-color: #fff; }
    .mt .lg-board-wrap { width: min(100vw, 560px, calc(100svh - var(--lg-bar-h) - 16px - 40px - 60px - 30px - 30px)); }
    .mt .lg-board-wrap.solved cg-board { box-shadow: 0 0 0 5px #2ECC9A; }
    .mt .lg-board-wrap.good cg-board { box-shadow: 0 0 0 5px #40E0D0; transition: box-shadow .15s; }
    .mt .lg-board-wrap.wrong cg-board { animation: mtshake .35s ease; }
    @keyframes mtshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .mt-task { min-height: 22px; max-width: min(100%, 520px); padding: 0 12px; box-sizing: border-box; text-align: center; font: 800 15px/1.3 var(--lg-font); color: var(--lg-ink); }
    .mt-task.say { color: #FF9F1C; }
    .mt-promo { position: absolute; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); }
    .mt-promo button { position: absolute; width: 12.5%; height: 12.5%; padding: 0; border: 0; border-radius: 50%; background: #b0b0b0; box-shadow: inset 0 0 12px rgba(0,0,0,.4); cursor: pointer; }
    .mt-promo button:hover { background: #d59120; border-radius: 0; }
    .mt-promo mpiece { display: block; width: 100%; height: 100%; background-size: cover; }
    .mt .lg-controls { grid-template-columns: repeat(4, 1fr); width: min(100%, 480px); }
    .mt[data-mode="puzzle"] .lg-controls { grid-template-columns: repeat(4, 1fr); }
    .mt[data-mode="practice"] .lg-controls { grid-template-columns: repeat(3, 1fr); }
    .mt[data-mode="puzzle"] #hint, .mt[data-mode="practice"] #hint, .mt[data-mode="puzzle"] .mt-ex { display: none; }
    .mt:not([data-mode="puzzle"]) .mt-prev, .mt:not([data-mode="puzzle"]) .mt-ex { display: none; }
    .mt-ex { padding: 3px 10px; border-radius: 999px; border: 2px solid var(--lg-line); background: var(--lg-surface); color: var(--lg-ink); font: 800 13px var(--lg-font); cursor: pointer; }
    .mt[data-mode="example"] .lg-controls { grid-template-columns: repeat(3, 1fr); }
    .mt[data-mode="example"] #show { display: none; }
    .mt[data-mode="example"] #next { box-shadow: 0 0 0 3px #2ECC9A; }
    .mt[data-mode="example"] .mt-task { min-height: 40px; font-size: 16px; }

    /* ---------- список розділів ---------- */
    .mt-menu { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 760px; overflow-y: auto; padding: 4px 12px 16px; box-sizing: border-box; touch-action: pan-y; }
    .mt-menu h2 { margin: 14px 4px 8px; font: 900 19px var(--lg-font); color: var(--lg-ink); }
    .mt-menu h2:first-child { margin-top: 2px; }
    .mt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
    .mt-card { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 4px 10px; min-height: 64px; padding: 8px 12px; text-align: left; border-radius: 16px; border: 2px solid var(--lg-line); background: var(--lg-surface); color: var(--lg-ink); font-family: var(--lg-font); box-shadow: var(--lg-btn-shadow); cursor: pointer; }
    .mt-card:active { transform: scale(.97); }
    .mt-card .ic { grid-row: span 2; font-size: 30px; text-align: center; }
    .mt-card .ic mpiece, .mt-goal mpiece { display: inline-block; width: 40px; height: 40px; background-size: cover; vertical-align: middle; }
    .mt-goal mpiece { width: 28px; height: 28px; }
    /* задачі: унизу лише одна панель (Меню · Підказка · Пояснення); задачу міняють стрілки біля номера */
    .mt-lives { display: none !important; }
    .mt[data-mode="puzzle"] > .lg-controls { display: none !important; }
    .mt-nav { display: inline-flex; align-items: center; gap: 6px; }
    .mt:not([data-mode="puzzle"]) .mt-arr { display: none; }
    .mt-arr { width: 40px; height: 36px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1); color: #fff; font: 900 26px/1 var(--lg-font); cursor: pointer; padding: 0 0 3px; }
    .mt-arr:active { transform: scale(.92); }
    .mt-arr:disabled { opacity: .3; }
    .mt-card b { font-size: 16px; font-weight: 900; }
    .mt-card small { grid-column: 2; font-size: 12px; font-weight: 700; color: var(--lg-muted); line-height: 1.2; }
    .mt-card .pr { grid-row: 1 / span 2; grid-column: 3; font-size: 13px; font-weight: 900; color: var(--lg-muted); white-space: nowrap; }
    .mt-card .pr.all { color: var(--lg-mint); }
    .mt[data-mode="menu"] > :not(.mt-menu) { display: none !important; }
    .mt:not([data-mode="menu"]) > .mt-menu { display: none; }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
      html.lg .lg-play.mt[data-mode="menu"] { display: flex; width: 100%; }
      html.lg .lg-play.mt > .mt-menu { max-width: 1000px; margin: 0 auto; }
      .mt-list { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
      html.lg .lg-play.mt > .mt-goal { font-size: 19px; }
      html.lg .lg-play.mt > .lg-controls { grid-template-columns: repeat(2, 1fr); }
    }
    /* «Пояснення»: статична картинка (дошка з прикладу + стрілка) і текст */
    .mt-exp { text-align: center; color: var(--lg-ink); }
    .mt-exp h2 { margin: 0 0 10px; font: 900 20px var(--lg-font); }
    .mt-exp-board { position: relative; width: min(100%, 300px); aspect-ratio: 1; margin: 0 auto; border-radius: 8px; overflow: hidden; background: var(--cg-board) center / cover; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    .mt-exp-board mpiece { position: absolute; width: 12.5%; height: 12.5%; background-size: cover; }
    .mt-exp-arrow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .mt-exp-text { margin: 12px 4px 4px; font: 800 16px/1.4 var(--lg-font); }
    .mt-exp-task { margin: 4px 4px 12px; font: 700 14px/1.4 var(--lg-font); opacity: .85; }

    /* ================= Новий дизайн задачі: ‹ назад · ‹ 4 / 40 › · ⛶ угорі; над дошкою — розділ і хто ходить ================= */
    .mt .mt-top { position: fixed; z-index: 30; top: calc(8px + env(safe-area-inset-top) + var(--fs-top, 0px)); left: 0; right: 0; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; width: auto; margin: 0; padding: 0 10px; }
    .mt { padding-top: 50px; box-sizing: border-box; }
    .mt[data-mode="menu"] > .mt-top { display: grid !important; }
    .mt-back { width: 40px; height: 40px; border-radius: 50%; background: #262D42; color: #fff; display: grid; place-items: center; text-decoration: none; font: 400 30px/1 Manrope, sans-serif; padding-bottom: 4px; box-sizing: border-box; }
    .mt-top .mt-goal { justify-self: center; min-width: 0; }
    .mt-navrow { display: flex; justify-content: center; }
    .mt-navrow .mt-nav { gap: 4px; }
    .mt-navrow .mt-count { padding: 0 10px; border: 0; background: none; font: 700 15px Manrope, sans-serif; letter-spacing: 1px; color: #fff; }
    .mt-navrow .mt-arr { width: 40px; height: 40px; border-radius: 50%; background: #262D42; font: 400 26px/1 Manrope, sans-serif; opacity: 1 !important; }
    .mt:not([data-mode="puzzle"]) .mt-navrow .mt-count { display: none; }
    .mt-fsslot { display: flex; justify-content: flex-end; }
    .mt-fsslot .lg-top-fs { position: static !important; width: 40px !important; height: 40px !important; border-radius: 50% !important; background: #262D42 !important; }
    .mt-fsslot .lg-top-fs svg { width: 20px !important; height: 20px !important; }
    .mt-goal { flex-direction: column; gap: 2px; font: 700 16px Manrope, var(--lg-font), sans-serif; }
    .mt-goal .mt-sec { display: block; font: 700 11.5px Manrope, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: #8c8c8c; }
    .mt-goal .mt-who { display: flex; align-items: center; gap: 7px; }
    .mt-goal.ok { color: #2ee6b8; } .mt-goal.bad { color: #F5C542; }
    .mt-task { font: 600 14px/1.35 Manrope, var(--lg-font), sans-serif; color: #8c8c8c; }
    .mt-side { border-color: #555; }
    /* меню розділів — як «Практика»: рядки на чорному з кружечками кольору розділу */
    .mt-menu h2 { font: 700 11.5px Manrope, sans-serif !important; letter-spacing: 1.5px; text-transform: uppercase; color: #8c8c8c !important; margin: 14px 6px 6px !important; }
    .mt-list { gap: 0 !important; }
    .mt-card { background: none !important; border: 0 !important; border-top: 1px solid #20263A !important; border-radius: 0 !important; box-shadow: none !important; color: #fff !important; }
    .mt-card .ic { border-radius: 50% !important; background: #1d1d1d !important; }
    .mt-card b { font-family: Manrope, sans-serif !important; font-weight: 700 !important; }
    .mt-card small { font-family: Manrope, sans-serif !important; color: #8c8c8c !important; opacity: 1 !important; }
    /* задачі як урок (?lesson): угорі ‹ НАЗВА ⛶ і кружечки, Пан Сова з бульбашкою; стрілок задач і верхнього рядка задач немає */
    .mt[data-lesson] > .mt-top, .mt[data-lesson] > .mt-navrow { display: none !important; }
    .mt[data-lesson] .lv-say .mt-goal { display: none; }
    .mt[data-lesson] { padding-top: 0; }
    .mt[data-lesson] .lv-say #task { color: #fff; }
    .mt[data-lesson] .lv-say:has(#task.ok) { background: linear-gradient(135deg, #1fbf98, #2ee6b8); border-color: transparent; }
    .mt[data-lesson] .lv-say:has(#task.ok.passed), .mt[data-lesson] .lv-say:has(#task.bad) { background: linear-gradient(135deg, #e0ad22, #F5C542); border-color: transparent; }
    .mt[data-lesson] .lv-say:has(#task.ok, #task.bad)::before { border-right-color: transparent; }
    .mt[data-lesson] .lv-say #task.ok, .mt[data-lesson] .lv-say #task.bad { color: #04241d !important; font-weight: 800; }
    .mt[data-lesson] .lv-say #task.passed, .mt[data-lesson] .lv-say #task.bad { color: #3d2c00 !important; }
  </style>
</head>
<body>
  <main class="lg-play mt" data-mode="menu">
    <div class="mt-top"><span class="lg-exit-slot"></span>
      <div class="mt-goal"><span id="goal"></span><span class="mt-lives" id="lives"></span><button type="button" class="mt-ex" id="ex" title="Приклад">📖 Приклад</button></div>
      <span class="mt-fsslot"></span></div>
    <section class="mt-menu" id="menu" aria-label="Розділи задач"></section>
    <div class="mt-navrow"><span class="mt-nav"><button type="button" class="mt-arr" id="pv" aria-label="Попередня задача">‹</button><span class="mt-count" id="count"></span><button type="button" class="mt-arr" id="nx" aria-label="Наступна задача">›</button></span></div>
    <div class="lg-board-wrap" id="wrap"><div class="lg-board-el" id="board"></div></div>
    <div class="mt-task" id="task"></div>
    <div class="lg-controls">
      <button type="button" id="list"><span class="ico">📋</span><span class="lbl">Розділи</span></button>
      <button type="button" id="hint"><span class="ico">💡</span><span class="lbl">Підказка</span></button>
      <button type="button" id="show"><span class="ico">👀</span><span class="lbl">Розв’язок</span></button>
      <button type="button" id="prev" class="mt-prev"><span class="ico">◀️</span><span class="lbl">Попередня</span></button>
      <button type="button" id="next"><span class="ico">▶️</span><span class="lbl">Далі</span></button>
    </div>
  </main>
  <script src="../shared/games.js?v=1790412596"></script>
  <script src="../shared/kit.js?v=1790412596" data-game="mate" data-night="on"></script>
  <script src="../shared/vid.js?v=1790412596"></script>
  <script type="module" src="mate.js?v=1790412596"></script>
</body>
</html>
