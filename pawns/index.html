<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style id="no-flash">html, body { background: #16152F; color: #fff; } body { animation: lgfade .25s ease-out; } @keyframes lgfade { from { opacity: 0; } }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Пішаки</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790317556">
  <link rel="stylesheet" href="../shared/play.css?v=1790317556">
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790317556"></script>
  <script src="../shared/kit.js?v=1790317556" data-game="pawns" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790317556';
    import { createRules } from './rules.js?v=1790317556';

    // Взяття на проході — за бажанням, у налаштуваннях
    const rules = createRules({ enPassant: () => LG.store.get('pawns:ep', false) });
    startGame({
      navOnly: ['flip', 'level', 'undo'], // унизу лише: Назад · Колір · Рівень · Підказка · Відмінити
      rules,
      extraSettings: () => {
        const l = document.createElement('label');
        l.className = 'lg-set-row';
        l.innerHTML = `<span>Взяття на проході</span><input type="checkbox" ${LG.store.get('pawns:ep', false) ? 'checked' : ''}>`;
        l.querySelector('input').addEventListener('change', e => LG.store.set('pawns:ep', e.target.checked));
        return l;
      }
    });
  </script>
</body>
</html>
