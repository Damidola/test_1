<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="el">
<!-- «elephant» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.el-body{transform-origin:200px 400px;animation:elSway 5s ease-in-out infinite}
@keyframes elSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.el-eyes{transform-origin:200px 164px;animation:elBlink 4.4s infinite}
@keyframes elBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.el-pup{animation:elLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes elLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.el-earl{transform-origin:140px 110px;animation:elEar 3.6s ease-in-out infinite}
.el-earr{transform-origin:260px 110px;animation:elEar 3.6s ease-in-out infinite reverse}
@keyframes elEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.el-armr{transform-origin:292px 344px;animation:elWave 2.8s ease-in-out infinite}
@keyframes elWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-10deg)}}
.el-arml{transform-origin:108px 344px;animation:elRest 3.6s ease-in-out infinite}
@keyframes elRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.el-armr{display:none}.lg-hero .el-armr{display:inline}.lg-hero .el-armrest{display:none}
.el-happy,.el-angry,.el-bhappy,.el-bangry,.el-eyeshappy,.el-steam,.el-red,.el-talk,.el-spark{opacity:0}
.el-happy,.el-angry,.el-norm,.el-talk{transition:opacity .2s}
.mood-happy .el-norm,.mood-happy .el-bnorm,.mood-happy .el-eyes{opacity:0}
.mood-happy .el-happy,.mood-happy .el-bhappy,.mood-happy .el-eyeshappy,.mood-happy .el-spark{opacity:1}
.mood-happy .el-body{animation:elJump .55s ease-in-out infinite}
@keyframes elJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .el-blush{opacity:.8}
.mood-happy .el-armr{animation:elCheer .55s ease-in-out infinite}
@keyframes elCheer{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}
.mood-happy .el-arml{animation:elCheerL .55s ease-in-out infinite}
@keyframes elCheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.el-spark{animation:elSpark 1.2s ease-in-out infinite}
@keyframes elSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .el-norm,.mood-angry .el-bnorm{opacity:0}
.mood-angry .el-angry,.mood-angry .el-bangry,.mood-angry .el-steam{opacity:1}
.mood-angry .el-red{opacity:.35}
.mood-angry .el-body{animation:elShake .18s linear infinite}
@keyframes elShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .el-pup{animation:none;transform:translate(0,3px)}
.mood-angry .el-earl{animation:none;transform:rotate(-18deg)}.mood-angry .el-earr{animation:none;transform:rotate(18deg)}
.mood-angry .el-armr{animation:elFist .3s ease-in-out infinite}
@keyframes elFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.el-steam{animation:elSteam 1.4s ease-out infinite}
@keyframes elSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .el-pup{animation:none;transform:translate(7px,-7px)}
.thinking .el-armr{animation:none;transform:rotate(-34deg) translate(-26px,14px)}
.talking:not(.mood-happy):not(.mood-angry) .el-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .el-talk{opacity:1}
.el-talkin{transform-origin:200px 248px;animation:elTalk .32s ease-in-out infinite alternate}
@keyframes elTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .el-body{animation:elPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes elPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .el-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .el-bnorm{opacity:0}.poked .el-bhappy{opacity:1;transform:translateY(-8px)}
.poked .el-norm{opacity:0}.poked .el-talk{opacity:1}.poked .el-talkin{animation:none}
.poked .el-earl{animation:none;transform:rotate(12deg)}.poked .el-earr{animation:none;transform:rotate(-12deg)}
</style>
<g class="el-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#8fa3b8"/>
  <path d="M150 400 C154 362 174 342 200 340 C226 342 246 362 250 400 Z" fill="#a9bbcd"/>
  <g class="el-earl"><path d="M122 120 C60 90 30 150 44 210 C54 256 96 266 128 244 Z" fill="#8fa3b8"/><path d="M116 136 C74 118 56 162 66 204 C74 234 100 240 120 226 Z" fill="#f2b8c6"/></g>
  <g class="el-earr"><path d="M278 120 C340 90 370 150 356 210 C346 256 304 266 272 244 Z" fill="#8fa3b8"/><path d="M284 136 C326 118 344 162 334 204 C326 234 300 240 280 226 Z" fill="#f2b8c6"/></g>
  <path d="M104 190 C104 124 146 90 200 90 C254 90 296 124 296 190 C296 250 262 290 200 290 C138 290 104 250 104 190 Z" fill="#9db0c4"/>
  <ellipse class="el-red" cx="200" cy="192" rx="96" ry="100" fill="#ff3b30"/>
  <path d="M176 206 C172 250 168 290 184 318 C192 332 212 330 214 316 C216 300 204 296 206 284 C210 262 226 240 224 206 Z" fill="#9db0c4"/>
  <g stroke="#7d91a6" stroke-width="3" fill="none" stroke-linecap="round"><path d="M184 256 q16 5 32 0 M184 276 q14 5 28 0 M188 296 q10 4 20 0"/></g>
  <path d="M160 226 C150 244 152 262 162 268" fill="none" stroke="#fffdf6" stroke-width="10" stroke-linecap="round"/><path d="M240 226 C250 244 248 262 238 268" fill="none" stroke="#fffdf6" stroke-width="10" stroke-linecap="round"/>
  <ellipse class="el-blush" cx="124" cy="200" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="el-blush" cx="276" cy="200" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#5f7185" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="el-bnorm" d="M126 130 Q150 118 174 128"/><path class="el-bnorm" d="M226 128 Q250 118 274 130"/>
    <path class="el-bhappy" d="M126 124 Q150 106 174 120"/><path class="el-bhappy" d="M226 120 Q250 106 274 124"/>
    <path class="el-bangry" d="M126 120 L174 140"/><path class="el-bangry" d="M274 120 L226 140"/>
  </g>
  <g class="el-eyes">
    <ellipse cx="150" cy="164" rx="20" ry="22" fill="#fff"/><ellipse cx="250" cy="164" rx="20" ry="22" fill="#fff"/>
    <g class="el-pup"><circle cx="153" cy="169" r="12" fill="#2b3240"/><circle cx="253" cy="169" r="12" fill="#2b3240"/>
      <circle cx="153" cy="169" r="6.6" fill="#1c1410"/><circle cx="253" cy="169" r="6.6" fill="#1c1410"/>
      <circle cx="158" cy="163" r="4.2" fill="#fff"/><circle cx="258" cy="163" r="4.2" fill="#fff"/></g>
  </g>
  <g class="el-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M130 170 Q150 148 170 170"/><path d="M230 170 Q250 148 270 170"/></g>
  <path class="el-norm" d="M186 242 Q200 260 214 242" fill="none" stroke="#5a3a4a" stroke-width="6" stroke-linecap="round"/>
  <g class="el-talk"><g class="el-talkin"><ellipse cx="200" cy="248" rx="18" ry="14" fill="#5a3a4a"/><ellipse cx="200" cy="255" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="el-happy"><path d="M178 236 Q200 282 222 236 Z" fill="#5a3a4a"/><path d="M186 238 L214 238 L210 245 L190 245 Z" fill="#fff"/><ellipse cx="200" cy="262" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="el-angry"><path d="M186 258 Q200 234 214 258 Q200 248 186 258 Z" fill="#5a3a4a"/><path d="M196 252 L204 252" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="el-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="el-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <g class="el-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#8fa3b8" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#b7c7d6"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="el-armrest">
    <path d="M292 344 C306 362 300 384 276 386" fill="none" stroke="#8fa3b8" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="272" cy="384" rx="18" ry="15" fill="#b7c7d6"/>
  </g>
  <g class="el-armr">
    <path d="M292 344 C314 334 326 310 330 290" fill="none" stroke="#8fa3b8" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(332 272)">
      <ellipse cx="0" cy="0" rx="20" ry="21" fill="#b7c7d6"/>
      <g fill="#b7c7d6"><ellipse cx="-13" cy="-17" rx="7" ry="9"/><ellipse cx="0" cy="-22" rx="7" ry="9"/><ellipse cx="13" cy="-17" rx="7" ry="9"/></g>
      <ellipse cx="0" cy="4" rx="9" ry="8" fill="#8fa3b8"/>
      <g fill="#8fa3b8"><circle cx="-12" cy="-17" r="3.5"/><circle cx="0" cy="-21" r="3.5"/><circle cx="12" cy="-17" r="3.5"/></g>
    </g>
  </g>
</g>
</svg>
