<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="dg">
<!-- «doge» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.dg-body{transform-origin:200px 400px;animation:dgSway 5s ease-in-out infinite}
@keyframes dgSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.dg-eyes{transform-origin:200px 174px;animation:dgBlink 4.4s infinite}
@keyframes dgBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.dg-pup{animation:dgLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes dgLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.dg-earl{transform-origin:140px 110px;animation:dgEar 3.6s ease-in-out infinite}
.dg-earr{transform-origin:260px 110px;animation:dgEar 3.6s ease-in-out infinite reverse}
@keyframes dgEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.dg-armr{transform-origin:292px 344px;animation:dgRestR 3.6s ease-in-out infinite}
@keyframes dgRestR{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
.dg-arml{transform-origin:108px 344px;animation:dgRest 3.6s ease-in-out infinite}
@keyframes dgRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.dg-happy,.dg-angry,.dg-bhappy,.dg-bangry,.dg-eyeshappy,.dg-steam,.dg-red,.dg-talk,.dg-spark{opacity:0}
.dg-happy,.dg-angry,.dg-norm,.dg-talk{transition:opacity .2s}
.mood-happy .dg-norm,.mood-happy .dg-bnorm,.mood-happy .dg-eyes{opacity:0}
.mood-happy .dg-happy,.mood-happy .dg-bhappy,.mood-happy .dg-eyeshappy,.mood-happy .dg-spark{opacity:1}
.mood-happy .dg-body{animation:dgJump .55s ease-in-out infinite}
@keyframes dgJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .dg-blush{opacity:.8}
.mood-happy .dg-armr{animation:dgCheer .55s ease-in-out infinite}
@keyframes dgCheer{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-172deg)}}
.mood-happy .dg-arml{animation:dgCheerL .55s ease-in-out infinite}
@keyframes dgCheerL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(172deg)}}
.dg-spark{animation:dgSpark 1.2s ease-in-out infinite}
@keyframes dgSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .dg-norm,.mood-angry .dg-bnorm{opacity:0}
.mood-angry .dg-angry,.mood-angry .dg-bangry,.mood-angry .dg-steam{opacity:1}
.mood-angry .dg-red{opacity:.35}
.mood-angry .dg-body{animation:dgShake .18s linear infinite}
@keyframes dgShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .dg-pup{animation:none;transform:translate(0,3px)}
.mood-angry .dg-earl{animation:none;transform:rotate(-18deg)}.mood-angry .dg-earr{animation:none;transform:rotate(18deg)}
.mood-angry .dg-armr{animation:dgFist .3s ease-in-out infinite}
@keyframes dgFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.dg-steam{animation:dgSteam 1.4s ease-out infinite}
@keyframes dgSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .dg-pup{animation:none;transform:translate(7px,-7px)}
.thinking .dg-armr{animation:none;transform:rotate(100deg)}
.talking:not(.mood-happy):not(.mood-angry) .dg-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .dg-talk{opacity:1}
.dg-talkin{transform-origin:200px 270px;animation:dgTalk .32s ease-in-out infinite alternate}
@keyframes dgTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .dg-body{animation:dgPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes dgPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .dg-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .dg-bnorm{opacity:0}.poked .dg-bhappy{opacity:1;transform:translateY(-8px)}
.poked .dg-norm{opacity:0}.poked .dg-talk{opacity:1}.poked .dg-talkin{animation:none}
.poked .dg-armr{animation:none;transform:rotate(-60deg)}.poked .dg-arml{animation:none;transform:rotate(60deg)}
.poked .dg-earl{animation:none;transform:rotate(12deg)}.poked .dg-earr{animation:none;transform:rotate(-12deg)}
</style>
<g class="dg-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#e39a4c"/>
  <path d="M140 400 C144 356 170 334 200 332 C230 334 256 356 260 400 Z" fill="#fbecd6"/>
  <g class="dg-earl"><path d="M100 140 L110 40 L178 92 Z" fill="#e39a4c"/><path d="M116 124 L122 66 L160 96 Z" fill="#fbecd6"/></g>
  <g class="dg-earr"><path d="M300 140 L290 40 L222 92 Z" fill="#e39a4c"/><path d="M284 124 L278 66 L240 96 Z" fill="#fbecd6"/></g>
  <path d="M92 188 C92 120 140 86 200 86 C260 86 308 120 308 188 C308 262 264 304 200 304 C136 304 92 262 92 188 Z" fill="#eaa458"/>
  <ellipse class="dg-red" cx="200" cy="196" rx="104" ry="106" fill="#ff3b30"/>
  <path d="M112 206 C120 168 160 160 200 176 C240 160 280 168 288 206 C292 268 252 304 200 304 C148 304 108 268 112 206 Z" fill="#fbecd6"/>
  <ellipse cx="148" cy="136" rx="10" ry="6" fill="#fbecd6"/><ellipse cx="252" cy="136" rx="10" ry="6" fill="#fbecd6"/>
  <ellipse cx="200" cy="232" rx="20" ry="14" fill="#2b1a10"/><ellipse cx="194" cy="228" rx="6" ry="3" fill="#fff" opacity=".6"/>
  <path d="M200 246 L200 256" stroke="#2b1a10" stroke-width="5" stroke-linecap="round"/>
  <!-- окуляри «deal with it» на лобі -->
  <g transform="translate(0 -2)"><rect x="126" y="98" width="62" height="22" rx="4" fill="#111"/><rect x="212" y="98" width="62" height="22" rx="4" fill="#111"/><rect x="186" y="102" width="28" height="7" fill="#111"/>
  <rect x="134" y="102" width="10" height="6" fill="#fff" opacity=".8"/><rect x="220" y="102" width="10" height="6" fill="#fff" opacity=".8"/></g>
  <ellipse class="dg-blush" cx="126" cy="214" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="dg-blush" cx="274" cy="214" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#9c5a22" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="dg-bnorm" d="M130 139 Q154 127 178 137"/><path class="dg-bnorm" d="M222 137 Q246 127 270 139"/>
    <path class="dg-bhappy" d="M130 133 Q154 115 178 129"/><path class="dg-bhappy" d="M222 129 Q246 115 270 133"/>
    <path class="dg-bangry" d="M130 129 L178 149"/><path class="dg-bangry" d="M270 129 L222 149"/>
  </g>
  <g class="dg-eyes">
    <ellipse cx="154" cy="174" rx="21" ry="23" fill="#fff"/><ellipse cx="246" cy="174" rx="21" ry="23" fill="#fff"/>
    <g class="dg-pup"><circle cx="157" cy="179" r="12" fill="#4a2a12"/><circle cx="249" cy="179" r="12" fill="#4a2a12"/>
      <circle cx="157" cy="179" r="6.6" fill="#1c1410"/><circle cx="249" cy="179" r="6.6" fill="#1c1410"/>
      <circle cx="162" cy="173" r="4.2" fill="#fff"/><circle cx="254" cy="173" r="4.2" fill="#fff"/></g>
  </g>
  <g class="dg-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M134 180 Q154 158 174 180"/><path d="M226 180 Q246 158 266 180"/></g>
  <path class="dg-norm" d="M176 264 Q200 282 224 264" fill="none" stroke="#6b2f1f" stroke-width="6" stroke-linecap="round"/>
  <g class="dg-talk"><g class="dg-talkin"><ellipse cx="200" cy="270" rx="18" ry="14" fill="#6b2f1f"/><ellipse cx="200" cy="277" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="dg-happy"><path d="M168 258 Q200 304 232 258 Z" fill="#6b2f1f"/><path d="M176 260 L224 260 L220 267 L180 267 Z" fill="#fff"/><ellipse cx="200" cy="284" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="dg-angry"><path d="M176 280 Q200 256 224 280 Q200 270 176 280 Z" fill="#6b2f1f"/><path d="M186 274 L214 274" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="dg-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="dg-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <g class="dg-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#e39a4c" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#fbecd6"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="dg-armr">
    <path d="M292 344 C306 362 300 384 276 386" fill="none" stroke="#e39a4c" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="272" cy="384" rx="18" ry="15" fill="#fbecd6"/>
    <path d="M282 378 q-5 -3 -10 0 M279 386 q-5 -3 -10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</g>
</svg>
