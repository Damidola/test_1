<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="mk">
<!-- «Мавпочка» — мультяшний суперник (власний малюнок, SVG). Настрій — класом на панелі суперника:
     .mood-happy (виграє / забрав фігуру), .mood-angry (програє / втратив фігуру), .thinking (думає), .talking (говорить).
     Без класів — спокійна: кліпає, озирається, погойдується. -->
<style>
.mk-body{transform-origin:200px 400px;animation:mkSway 5s ease-in-out infinite}
@keyframes mkSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.mk-eyes{transform-origin:200px 180px;animation:mkBlink 4.6s infinite}
@keyframes mkBlink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
.mk-pup{animation:mkLook 8s ease-in-out infinite;transition:transform .3s}
@keyframes mkLook{0%,35%,100%{transform:translate(0,0)}42%,55%{transform:translate(-6px,1px)}62%,72%{transform:translate(6px,-1px)}}
/* права рука махає, ліва з бананом злегка похитується */
.mk-armr{transform-origin:290px 338px;animation:mkWave 2.4s ease-in-out infinite}
@keyframes mkWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-10deg)}}
.mk-arml{transform-origin:112px 338px;animation:mkBan 3.4s ease-in-out infinite}
@keyframes mkBan{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.mood-happy .mk-armr{animation:mkCheer .55s ease-in-out infinite}
@keyframes mkCheer{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}
.mood-happy .mk-arml{animation:mkCheerL .55s ease-in-out infinite}
@keyframes mkCheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.mood-angry .mk-armr{animation:mkFist .3s ease-in-out infinite}
@keyframes mkFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.thinking .mk-armr{animation:none;transform:rotate(-32deg) translate(-22px,10px)}
.mk-tail{transform-origin:330px 390px;animation:mkTail 3s ease-in-out infinite}
@keyframes mkTail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.mk-happy,.mk-angry,.mk-bhappy,.mk-bangry,.mk-eyeshappy,.mk-steam,.mk-red,.mk-talk,.mk-spark{opacity:0}
.mk-happy,.mk-angry,.mk-norm,.mk-talk{transition:opacity .2s}
/* радіє */
.mood-happy .mk-norm,.mood-happy .mk-bnorm,.mood-happy .mk-eyes{opacity:0}
.mood-happy .mk-happy,.mood-happy .mk-bhappy,.mood-happy .mk-eyeshappy,.mood-happy .mk-spark{opacity:1}
.mood-happy .mk-body{animation:mkJump .55s ease-in-out infinite}
@keyframes mkJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .mk-blush{opacity:.8}
.mk-spark{animation:mkSpark 1.2s ease-in-out infinite}
@keyframes mkSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
/* злиться */
.mood-angry .mk-norm,.mood-angry .mk-bnorm{opacity:0}
.mood-angry .mk-angry,.mood-angry .mk-bangry,.mood-angry .mk-steam{opacity:1}
.mood-angry .mk-red{opacity:.35}
.mood-angry .mk-body{animation:mkShake .18s linear infinite}
@keyframes mkShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .mk-pup{animation:none;transform:translate(0,3px)}
.mk-steam{animation:mkSteam 1.4s ease-out infinite}
@keyframes mkSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.mood-angry .mk-steam{animation:mkSteam 1.4s ease-out infinite}
/* думає — очі вгору вбік */
.thinking .mk-pup{animation:none;transform:translate(7px,-7px)}
/* говорить — рот відкривається */
.talking:not(.mood-happy):not(.mood-angry) .mk-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .mk-talk{opacity:1}
.mk-talkin{transform-origin:200px 262px;animation:mkTalk .32s ease-in-out infinite alternate}
@keyframes mkTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
</style>
<g class="mk-tail"><path d="M318 400 C340 360 380 350 372 310 C366 282 336 290 346 312" fill="none" stroke="#7a431c" stroke-width="16" stroke-linecap="round"/></g>
<g class="mk-body">
  <!-- тулуб з плечима -->
  <path d="M86 400 C88 346 128 312 200 308 C272 312 312 346 314 400 Z" fill="#8f5226"/>
  <path d="M140 400 C142 360 166 334 200 332 C234 334 258 360 260 400 Z" fill="#e9b98f"/>
  <!-- вуха -->
  <circle cx="92" cy="186" r="44" fill="#8f5226"/><circle cx="92" cy="186" r="27" fill="#f2b3a0"/>
  <circle cx="308" cy="186" r="44" fill="#8f5226"/><circle cx="308" cy="186" r="27" fill="#f2b3a0"/>
  <!-- голова -->
  <ellipse cx="200" cy="182" rx="108" ry="102" fill="#a4632f"/>
  <path d="M168 88 C172 60 190 54 196 70 C200 48 220 46 222 70 C232 58 248 66 240 90 C220 80 190 80 168 88 Z" fill="#a4632f"/>
  <!-- лице -->
  <g fill="#f6d2ae"><circle cx="166" cy="176" r="50"/><circle cx="234" cy="176" r="50"/><ellipse cx="200" cy="242" rx="78" ry="54"/></g>
  <ellipse class="mk-red" cx="200" cy="200" rx="104" ry="90" fill="#ff3b30"/>
  <ellipse class="mk-blush" cx="128" cy="226" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="mk-blush" cx="272" cy="226" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <!-- брови -->
  <g stroke="#5a3214" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="mk-bnorm" d="M138 128 Q162 116 186 126"/><path class="mk-bnorm" d="M214 126 Q238 116 262 128"/>
    <path class="mk-bhappy" d="M138 122 Q162 104 186 118"/><path class="mk-bhappy" d="M214 118 Q238 104 262 122"/>
    <path class="mk-bangry" d="M138 118 L186 140"/><path class="mk-bangry" d="M262 118 L214 140"/>
  </g>
  <!-- очі -->
  <g class="mk-eyes">
    <ellipse cx="166" cy="180" rx="25" ry="29" fill="#fff"/><ellipse cx="234" cy="180" rx="25" ry="29" fill="#fff"/>
    <g class="mk-pup"><circle cx="168" cy="186" r="14" fill="#2b1a10"/><circle cx="236" cy="186" r="14" fill="#2b1a10"/>
      <circle cx="173" cy="180" r="5" fill="#fff"/><circle cx="241" cy="180" r="5" fill="#fff"/></g>
  </g>
  <g class="mk-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M146 186 Q166 164 186 186"/><path d="M214 186 Q234 164 254 186"/></g>
  <!-- ніс -->
  <ellipse cx="190" cy="226" rx="6" ry="4.5" fill="#6b3c1a"/><ellipse cx="210" cy="226" rx="6" ry="4.5" fill="#6b3c1a"/>
  <!-- роти -->
  <path class="mk-norm" d="M170 256 Q200 276 230 256" fill="none" stroke="#6b2f1f" stroke-width="6" stroke-linecap="round"/>
  <g class="mk-talk"><g class="mk-talkin"><ellipse cx="200" cy="262" rx="20" ry="16" fill="#6b2f1f"/><ellipse cx="200" cy="270" rx="11" ry="6" fill="#e5645a"/></g></g>
  <g class="mk-happy"><path d="M160 248 Q200 300 240 248 Z" fill="#6b2f1f"/><path d="M168 250 L232 250 L228 258 L172 258 Z" fill="#fff"/><ellipse cx="200" cy="278" rx="16" ry="8" fill="#e5645a"/></g>
  <g class="mk-angry"><path d="M166 272 Q200 246 234 272 Q200 262 166 272 Z" fill="#6b2f1f"/><path d="M176 266 L224 266" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <!-- ліва рука з бананом (перед грудьми) -->
  <g class="mk-arml">
    <path d="M112 338 C100 360 110 384 142 380" fill="none" stroke="#8f5226" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(150 372) rotate(18)">
      <defs><linearGradient id="mkBan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c21c"/><stop offset=".55" stop-color="#ffe066"/><stop offset="1" stop-color="#f2b705"/></linearGradient></defs>
      <path d="M-4 0 C-26 -26 -24 -64 2 -86 C-6 -62 -2 -30 16 -8 Z" fill="url(#mkBan)" stroke="#c98f0a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-2 -14 C-12 -34 -10 -58 0 -74" fill="none" stroke="#fff4c2" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <path d="M2 -86 C4 -92 8 -94 10 -92" fill="none" stroke="#5a3a10" stroke-width="5" stroke-linecap="round"/>
      <path d="M-2 0 L4 10" stroke="#6b4a10" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- кулачок тримає банан -->
    <ellipse cx="146" cy="376" rx="19" ry="16" fill="#e9b98f"/>
    <path d="M134 370 q6 -4 12 0 M136 378 q6 -4 12 0 M138 386 q6 -4 12 0" fill="none" stroke="#b9855c" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- права рука махає -->
  <g class="mk-armr">
    <path d="M290 338 C312 330 326 306 330 286" fill="none" stroke="#8f5226" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(332 272)">
      <ellipse cx="0" cy="0" rx="20" ry="22" fill="#e9b98f"/>
      <g fill="#e9b98f"><ellipse cx="-14" cy="-18" rx="6" ry="11" transform="rotate(-25 -14 -18)"/><ellipse cx="-3" cy="-24" rx="6" ry="12"/><ellipse cx="9" cy="-22" rx="6" ry="11" transform="rotate(18 9 -22)"/><ellipse cx="20" cy="-8" rx="6" ry="10" transform="rotate(55 20 -8)"/></g>
      <ellipse cx="0" cy="4" rx="10" ry="9" fill="#f2c9a2"/>
    </g>
  </g>
  <!-- пара зі злості -->
  <g class="mk-steam" fill="#fff" opacity=".85"><circle cx="100" cy="100" r="14"/><circle cx="86" cy="82" r="10"/><circle cx="300" cy="100" r="14"/><circle cx="314" cy="82" r="10"/></g>
  <!-- іскорки радості -->
  <g class="mk-spark" fill="#ffd23f"><path d="M70 110 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M330 104 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>
</g>
</svg>
