<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="pf">
<!-- «teacher» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.pf-body{transform-origin:200px 400px;animation:pfSway 5s ease-in-out infinite}
@keyframes pfSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.pf-eyes{transform-origin:200px 174px;animation:pfBlink 4.4s infinite}
@keyframes pfBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.pf-pup{animation:pfLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes pfLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.pf-earl{transform-origin:140px 110px;animation:pfEar 3.6s ease-in-out infinite}
.pf-earr{transform-origin:260px 110px;animation:pfEar 3.6s ease-in-out infinite reverse}
@keyframes pfEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.pf-armr{transform-origin:292px 344px;animation:pfWave 2.8s ease-in-out infinite}
@keyframes pfWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-10deg)}}
.pf-arml{transform-origin:108px 344px;animation:pfRest 3.6s ease-in-out infinite}
@keyframes pfRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.pf-armr{display:none}.lg-hero .pf-armr{display:inline}.lg-hero .pf-armrest{display:none}
.pf-happy,.pf-angry,.pf-bhappy,.pf-bangry,.pf-eyeshappy,.pf-steam,.pf-red,.pf-talk,.pf-spark{opacity:0}
.pf-happy,.pf-angry,.pf-norm,.pf-talk{transition:opacity .2s}
.mood-happy .pf-norm,.mood-happy .pf-bnorm,.mood-happy .pf-eyes{opacity:0}
.mood-happy .pf-happy,.mood-happy .pf-bhappy,.mood-happy .pf-eyeshappy,.mood-happy .pf-spark{opacity:1}
.mood-happy .pf-body{animation:pfJump .55s ease-in-out infinite}
@keyframes pfJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .pf-blush{opacity:.8}
.mood-happy .pf-armr{animation:pfCheer .55s ease-in-out infinite}
@keyframes pfCheer{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}
.mood-happy .pf-arml{animation:pfCheerL .55s ease-in-out infinite}
@keyframes pfCheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.pf-spark{animation:pfSpark 1.2s ease-in-out infinite}
@keyframes pfSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .pf-norm,.mood-angry .pf-bnorm{opacity:0}
.mood-angry .pf-angry,.mood-angry .pf-bangry,.mood-angry .pf-steam{opacity:1}
.mood-angry .pf-red{opacity:.35}
.mood-angry .pf-body{animation:pfShake .18s linear infinite}
@keyframes pfShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .pf-pup{animation:none;transform:translate(0,3px)}
.mood-angry .pf-earl{animation:none;transform:rotate(-18deg)}.mood-angry .pf-earr{animation:none;transform:rotate(18deg)}
.mood-angry .pf-armr{animation:pfFist .3s ease-in-out infinite}
@keyframes pfFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.pf-steam{animation:pfSteam 1.4s ease-out infinite}
@keyframes pfSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .pf-pup{animation:none;transform:translate(7px,-7px)}
.thinking .pf-armr{animation:none;transform:rotate(-34deg) translate(-26px,14px)}
.talking:not(.mood-happy):not(.mood-angry) .pf-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .pf-talk{opacity:1}
.pf-talkin{transform-origin:200px 262px;animation:pfTalk .32s ease-in-out infinite alternate}
@keyframes pfTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .pf-body{animation:pfPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes pfPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .pf-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .pf-bnorm{opacity:0}.poked .pf-bhappy{opacity:1;transform:translateY(-8px)}
.poked .pf-norm{opacity:0}.poked .pf-talk{opacity:1}.poked .pf-talkin{animation:none}
.poked .pf-earl{animation:none;transform:rotate(12deg)}.poked .pf-earr{animation:none;transform:rotate(-12deg)}
.pf-tassel{transform-origin:276px 84px;animation:pfTassel 3s ease-in-out infinite}
@keyframes pfTassel{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.lg-teacher.mood-happy .pf-armr,.lg-teacher.thinking .pf-armr{display:inline}
.lg-teacher.mood-happy .pf-armrest,.lg-teacher.thinking .pf-armrest{display:none}</style>
<g class="pf-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#5d6b86"/>
  <path d="M140 400 C144 356 170 332 200 330 C230 332 256 356 260 400 Z" fill="#eef0f4"/>
  <g fill="none" stroke="#c9ceda" stroke-width="4" stroke-linecap="round"><path d="M178 372 q8 7 16 0 M202 372 q8 7 16 0 M190 392 q8 7 16 0"/></g>
  <!-- метелик -->
  <path d="M200 324 L166 306 L166 342 Z M200 324 L234 306 L234 342 Z" fill="#e8505b"/><circle cx="200" cy="324" r="9" fill="#c23a45"/>
  <g class="pf-earl"><path d="M106 130 L96 66 L152 104 Z" fill="#4d5a73"/></g>
  <g class="pf-earr"><path d="M294 130 L304 66 L248 104 Z" fill="#4d5a73"/></g>
  <ellipse cx="200" cy="192" rx="112" ry="114" fill="#7c8aa6"/>
  <ellipse class="pf-red" cx="200" cy="196" rx="108" ry="110" fill="#ff3b30"/>
  <circle cx="152" cy="174" r="48" fill="#eef0f4"/><circle cx="248" cy="174" r="48" fill="#eef0f4"/>
  <path d="M186 214 L214 214 L200 242 Z" fill="#f2a93b" stroke="#c9801c" stroke-width="3" stroke-linejoin="round"/>
  <!-- шапочка випускника -->
  <g>
    <path d="M140 96 C150 78 250 78 260 96 L256 112 C230 102 170 102 144 112 Z" fill="#23283a"/>
    <path d="M200 40 L300 72 L200 104 L100 72 Z" fill="#2e3550"/>
    <circle cx="200" cy="72" r="6" fill="#f5c542"/>
    <path class="pf-tassel" d="M200 72 L276 84 L278 122" fill="none" stroke="#f5c542" stroke-width="4" stroke-linecap="round"/>
    <path d="M272 118 l6 22 6 -22 z" fill="#f5c542"/>
  </g>
  <ellipse class="pf-blush" cx="108" cy="216" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="pf-blush" cx="292" cy="216" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#e7eaf0" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="pf-bnorm" d="M128 134 Q152 122 176 132"/><path class="pf-bnorm" d="M224 132 Q248 122 272 134"/>
    <path class="pf-bhappy" d="M128 128 Q152 110 176 124"/><path class="pf-bhappy" d="M224 124 Q248 110 272 128"/>
    <path class="pf-bangry" d="M128 124 L176 144"/><path class="pf-bangry" d="M272 124 L224 144"/>
  </g>
  <g class="pf-eyes">
    <ellipse cx="152" cy="174" rx="26" ry="28" fill="#fff"/><ellipse cx="248" cy="174" rx="26" ry="28" fill="#fff"/>
    <g class="pf-pup"><circle cx="155" cy="179" r="15" fill="#6b4a2a"/><circle cx="251" cy="179" r="15" fill="#6b4a2a"/>
      <circle cx="155" cy="179" r="8.2" fill="#1c1410"/><circle cx="251" cy="179" r="8.2" fill="#1c1410"/>
      <circle cx="160" cy="173" r="5.2" fill="#fff"/><circle cx="256" cy="173" r="5.2" fill="#fff"/></g>
  </g>
  <g class="pf-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M132 180 Q152 158 172 180"/><path d="M228 180 Q248 158 268 180"/></g>
  <path class="pf-norm" d="M182 256 Q200 274 218 256" fill="none" stroke="#6b3a1a" stroke-width="6" stroke-linecap="round"/>
  <g class="pf-talk"><g class="pf-talkin"><ellipse cx="200" cy="262" rx="18" ry="14" fill="#6b3a1a"/><ellipse cx="200" cy="269" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="pf-happy"><path d="M174 250 Q200 296 226 250 Z" fill="#6b3a1a"/><path d="M182 252 L218 252 L214 259 L186 259 Z" fill="#fff"/><ellipse cx="200" cy="276" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="pf-angry"><path d="M182 272 Q200 248 218 272 Q200 262 182 272 Z" fill="#6b3a1a"/><path d="M192 266 L208 266" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="pf-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="pf-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <!-- окуляри -->
  <g fill="none" stroke="#2e3550" stroke-width="6"><circle cx="152" cy="174" r="40"/><circle cx="248" cy="174" r="40"/><path d="M192 170 Q200 162 208 170"/>
    <path d="M112 168 L96 160 M288 168 L304 160" stroke-linecap="round"/></g>
  <g fill="#fff" opacity=".35"><path d="M128 150 q10 -12 24 -12 l-4 8 q-10 0 -14 10z"/><path d="M224 150 q10 -12 24 -12 l-4 8 q-10 0 -14 10z"/></g>
  <g class="pf-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#7c8aa6" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#4d5a73"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="pf-armrest">
    <path d="M292 344 C306 362 300 384 276 386" fill="none" stroke="#7c8aa6" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="272" cy="384" rx="18" ry="15" fill="#4d5a73"/>
  </g>
  <g class="pf-armr">
    <path d="M292 344 C314 334 326 310 330 290" fill="none" stroke="#7c8aa6" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(332 272)">
      <ellipse cx="0" cy="0" rx="20" ry="21" fill="#4d5a73"/>
      <g fill="#4d5a73"><ellipse cx="-13" cy="-17" rx="7" ry="9"/><ellipse cx="0" cy="-22" rx="7" ry="9"/><ellipse cx="13" cy="-17" rx="7" ry="9"/></g>
      <ellipse cx="0" cy="4" rx="9" ry="8" fill="#eef0f4"/>
      <g fill="#eef0f4"><circle cx="-12" cy="-17" r="3.5"/><circle cx="0" cy="-21" r="3.5"/><circle cx="12" cy="-17" r="3.5"/></g>
    </g>
  </g>
</g>
</svg>
