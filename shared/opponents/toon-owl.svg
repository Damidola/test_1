<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="ow">
<!-- «owl» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.ow-body{transform-origin:200px 400px;animation:owSway 5s ease-in-out infinite}
@keyframes owSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.ow-eyes{transform-origin:200px 172px;animation:owBlink 4.4s infinite}
@keyframes owBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.ow-pup{animation:owLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes owLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.ow-earl{transform-origin:140px 110px;animation:owEar 3.6s ease-in-out infinite}
.ow-earr{transform-origin:260px 110px;animation:owEar 3.6s ease-in-out infinite reverse}
@keyframes owEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.ow-armr{transform-origin:292px 344px;animation:owWave 2.8s ease-in-out infinite}
@keyframes owWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-10deg)}}
.ow-arml{transform-origin:108px 344px;animation:owRest 3.6s ease-in-out infinite}
@keyframes owRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.ow-armr{display:none}.lg-hero .ow-armr{display:inline}.lg-hero .ow-armrest{display:none}
.ow-happy,.ow-angry,.ow-bhappy,.ow-bangry,.ow-eyeshappy,.ow-steam,.ow-red,.ow-talk,.ow-spark{opacity:0}
.ow-happy,.ow-angry,.ow-norm,.ow-talk{transition:opacity .2s}
.mood-happy .ow-norm,.mood-happy .ow-bnorm,.mood-happy .ow-eyes{opacity:0}
.mood-happy .ow-happy,.mood-happy .ow-bhappy,.mood-happy .ow-eyeshappy,.mood-happy .ow-spark{opacity:1}
.mood-happy .ow-body{animation:owJump .55s ease-in-out infinite}
@keyframes owJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .ow-blush{opacity:.8}
.mood-happy .ow-armr{animation:owCheer .55s ease-in-out infinite}
@keyframes owCheer{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}
.mood-happy .ow-arml{animation:owCheerL .55s ease-in-out infinite}
@keyframes owCheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.ow-spark{animation:owSpark 1.2s ease-in-out infinite}
@keyframes owSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .ow-norm,.mood-angry .ow-bnorm{opacity:0}
.mood-angry .ow-angry,.mood-angry .ow-bangry,.mood-angry .ow-steam{opacity:1}
.mood-angry .ow-red{opacity:.35}
.mood-angry .ow-body{animation:owShake .18s linear infinite}
@keyframes owShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .ow-pup{animation:none;transform:translate(0,3px)}
.mood-angry .ow-earl{animation:none;transform:rotate(-18deg)}.mood-angry .ow-earr{animation:none;transform:rotate(18deg)}
.mood-angry .ow-armr{animation:owFist .3s ease-in-out infinite}
@keyframes owFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.ow-steam{animation:owSteam 1.4s ease-out infinite}
@keyframes owSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .ow-pup{animation:none;transform:translate(7px,-7px)}
.thinking .ow-armr{animation:none;transform:rotate(-34deg) translate(-26px,14px)}
.talking:not(.mood-happy):not(.mood-angry) .ow-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .ow-talk{opacity:1}
.ow-talkin{transform-origin:200px 262px;animation:owTalk .32s ease-in-out infinite alternate}
@keyframes owTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .ow-body{animation:owPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes owPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .ow-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .ow-bnorm{opacity:0}.poked .ow-bhappy{opacity:1;transform:translateY(-8px)}
.poked .ow-norm{opacity:0}.poked .ow-talk{opacity:1}.poked .ow-talkin{animation:none}
.poked .ow-earl{animation:none;transform:rotate(12deg)}.poked .ow-earr{animation:none;transform:rotate(-12deg)}
</style>
<g class="ow-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#8a6a4f"/>
  <path d="M136 400 C140 356 166 330 200 328 C234 330 260 356 264 400 Z" fill="#e9dcc6"/>
  <g fill="none" stroke="#c9b597" stroke-width="4" stroke-linecap="round"><path d="M166 356 q8 7 16 0 M190 356 q8 7 16 0 M214 356 q8 7 16 0 M178 378 q8 7 16 0 M202 378 q8 7 16 0"/></g>
  <g class="ow-earl"><path d="M104 128 L96 58 L150 100 Z" fill="#6f533c"/></g>
  <g class="ow-earr"><path d="M296 128 L304 58 L250 100 Z" fill="#6f533c"/></g>
  <ellipse cx="200" cy="190" rx="112" ry="116" fill="#8a6a4f"/>
  <ellipse class="ow-red" cx="200" cy="196" rx="108" ry="110" fill="#ff3b30"/>
  <circle cx="152" cy="172" r="50" fill="#e9dcc6"/><circle cx="248" cy="172" r="50" fill="#e9dcc6"/>
  <path d="M200 92 L186 128 L214 128 Z" fill="#6f533c"/>
  <path d="M186 212 L214 212 L200 240 Z" fill="#f2a93b" stroke="#c9801c" stroke-width="3" stroke-linejoin="round"/>
  <ellipse class="ow-blush" cx="108" cy="214" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="ow-blush" cx="292" cy="214" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#4a3524" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="ow-bnorm" d="M128 128 Q152 116 176 126"/><path class="ow-bnorm" d="M224 126 Q248 116 272 128"/>
    <path class="ow-bhappy" d="M128 122 Q152 104 176 118"/><path class="ow-bhappy" d="M224 118 Q248 104 272 122"/>
    <path class="ow-bangry" d="M128 118 L176 138"/><path class="ow-bangry" d="M272 118 L224 138"/>
  </g>
  <g class="ow-eyes">
    <ellipse cx="152" cy="172" rx="30" ry="32" fill="#fff"/><ellipse cx="248" cy="172" rx="30" ry="32" fill="#fff"/>
    <g class="ow-pup"><circle cx="155" cy="177" r="18" fill="#f2a93b"/><circle cx="251" cy="177" r="18" fill="#f2a93b"/>
      <circle cx="155" cy="177" r="9.9" fill="#1c1410"/><circle cx="251" cy="177" r="9.9" fill="#1c1410"/>
      <circle cx="160" cy="171" r="6.3" fill="#fff"/><circle cx="256" cy="171" r="6.3" fill="#fff"/></g>
  </g>
  <g class="ow-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M132 178 Q152 156 172 178"/><path d="M228 178 Q248 156 268 178"/></g>
  <path class="ow-norm" d="M182 256 Q200 274 218 256" fill="none" stroke="#6b3a1a" stroke-width="6" stroke-linecap="round"/>
  <g class="ow-talk"><g class="ow-talkin"><ellipse cx="200" cy="262" rx="18" ry="14" fill="#6b3a1a"/><ellipse cx="200" cy="269" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="ow-happy"><path d="M174 250 Q200 296 226 250 Z" fill="#6b3a1a"/><path d="M182 252 L218 252 L214 259 L186 259 Z" fill="#fff"/><ellipse cx="200" cy="276" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="ow-angry"><path d="M182 272 Q200 248 218 272 Q200 262 182 272 Z" fill="#6b3a1a"/><path d="M192 266 L208 266" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="ow-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="ow-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <g class="ow-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#8a6a4f" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#6f533c"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="ow-armrest">
    <path d="M292 344 C306 362 300 384 276 386" fill="none" stroke="#8a6a4f" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="272" cy="384" rx="18" ry="15" fill="#6f533c"/>
  </g>
  <g class="ow-armr">
    <path d="M292 344 C314 334 326 310 330 290" fill="none" stroke="#8a6a4f" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(332 272)">
      <ellipse cx="0" cy="0" rx="20" ry="21" fill="#6f533c"/>
      <g fill="#6f533c"><ellipse cx="-13" cy="-17" rx="7" ry="9"/><ellipse cx="0" cy="-22" rx="7" ry="9"/><ellipse cx="13" cy="-17" rx="7" ry="9"/></g>
      <ellipse cx="0" cy="4" rx="9" ry="8" fill="#e9dcc6"/>
      <g fill="#e9dcc6"><circle cx="-12" cy="-17" r="3.5"/><circle cx="0" cy="-21" r="3.5"/><circle cx="12" cy="-17" r="3.5"/></g>
    </g>
  </g>
</g>
</svg>
