<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="ct">
<!-- «smudge» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.ct-body{transform-origin:200px 400px;animation:ctSway 5s ease-in-out infinite}
@keyframes ctSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.ct-eyes{transform-origin:200px 184px;animation:ctBlink 4.4s infinite}
@keyframes ctBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.ct-pup{animation:ctLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes ctLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.ct-earl{transform-origin:140px 110px;animation:ctEar 3.6s ease-in-out infinite}
.ct-earr{transform-origin:260px 110px;animation:ctEar 3.6s ease-in-out infinite reverse}
@keyframes ctEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.ct-armr{transform-origin:292px 344px;animation:ctRestR 3.6s ease-in-out infinite}
@keyframes ctRestR{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
.ct-arml{transform-origin:108px 344px;animation:ctRest 3.6s ease-in-out infinite}
@keyframes ctRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.ct-happy,.ct-angry,.ct-bhappy,.ct-bangry,.ct-eyeshappy,.ct-steam,.ct-red,.ct-talk,.ct-spark{opacity:0}
.ct-happy,.ct-angry,.ct-norm,.ct-talk{transition:opacity .2s}
.mood-happy .ct-norm,.mood-happy .ct-bnorm,.mood-happy .ct-eyes{opacity:0}
.mood-happy .ct-happy,.mood-happy .ct-bhappy,.mood-happy .ct-eyeshappy,.mood-happy .ct-spark{opacity:1}
.mood-happy .ct-body{animation:ctJump .55s ease-in-out infinite}
@keyframes ctJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .ct-blush{opacity:.8}
.mood-happy .ct-armr{animation:ctCheer .55s ease-in-out infinite}
@keyframes ctCheer{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-172deg)}}
.mood-happy .ct-arml{animation:ctCheerL .55s ease-in-out infinite}
@keyframes ctCheerL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(172deg)}}
.ct-spark{animation:ctSpark 1.2s ease-in-out infinite}
@keyframes ctSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .ct-norm,.mood-angry .ct-bnorm{opacity:0}
.mood-angry .ct-angry,.mood-angry .ct-bangry,.mood-angry .ct-steam{opacity:1}
.mood-angry .ct-red{opacity:.35}
.mood-angry .ct-body{animation:ctShake .18s linear infinite}
@keyframes ctShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .ct-pup{animation:none;transform:translate(0,3px)}
.mood-angry .ct-earl{animation:none;transform:rotate(-18deg)}.mood-angry .ct-earr{animation:none;transform:rotate(18deg)}
.mood-angry .ct-armr{animation:ctFist .3s ease-in-out infinite}
@keyframes ctFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.ct-steam{animation:ctSteam 1.4s ease-out infinite}
@keyframes ctSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .ct-pup{animation:none;transform:translate(7px,-7px)}
.thinking .ct-armr{animation:none;transform:rotate(100deg)}
.talking:not(.mood-happy):not(.mood-angry) .ct-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .ct-talk{opacity:1}
.ct-talkin{transform-origin:200px 262px;animation:ctTalk .32s ease-in-out infinite alternate}
@keyframes ctTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .ct-body{animation:ctPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes ctPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .ct-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .ct-bnorm{opacity:0}.poked .ct-bhappy{opacity:1;transform:translateY(-8px)}
.poked .ct-norm{opacity:0}.poked .ct-talk{opacity:1}.poked .ct-talkin{animation:none}
.poked .ct-armr{animation:none;transform:rotate(-60deg)}.poked .ct-arml{animation:none;transform:rotate(60deg)}
.poked .ct-earl{animation:none;transform:rotate(12deg)}.poked .ct-earr{animation:none;transform:rotate(-12deg)}
</style>
<g class="ct-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#f4f1ec"/>
  <path d="M84 400 C88 344 132 312 200 310" fill="none" stroke="#dcd6cf" stroke-width="4"/>
  <g class="ct-earl"><path d="M104 132 L112 44 L176 96 Z" fill="#f4f1ec" stroke="#dcd6cf" stroke-width="3" stroke-linejoin="round"/><path d="M118 116 L122 66 L160 98 Z" fill="#f6b8c4"/></g>
  <g class="ct-earr"><path d="M296 132 L288 44 L224 96 Z" fill="#f4f1ec" stroke="#dcd6cf" stroke-width="3" stroke-linejoin="round"/><path d="M282 116 L278 66 L240 98 Z" fill="#f6b8c4"/></g>
  <path d="M92 190 C92 118 142 84 200 84 C258 84 308 118 308 190 C308 262 262 306 200 306 C138 306 92 262 92 190 Z" fill="#fbf9f6" stroke="#e2dcd4" stroke-width="3"/>
  <path d="M96 214 l-18 -4 M96 226 l-20 4 M304 214 l18 -4 M304 226 l20 4" stroke="#e2dcd4" stroke-width="6" stroke-linecap="round"/>
  <ellipse class="ct-red" cx="200" cy="196" rx="104" ry="108" fill="#ff3b30"/>
  <ellipse cx="200" cy="244" rx="46" ry="30" fill="#fff"/>
  <path d="M190 226 L210 226 L200 238 Z" fill="#f28ea3"/>
  <g stroke="#cfc6bc" stroke-width="3" stroke-linecap="round"><path d="M150 240 L96 232 M150 250 L98 256 M250 240 L304 232 M250 250 L302 256"/></g>
  <ellipse class="ct-blush" cx="120" cy="222" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="ct-blush" cx="280" cy="222" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#bdb3a8" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="ct-bnorm" d="M130 147 Q154 135 178 145"/><path class="ct-bnorm" d="M222 145 Q246 135 270 147"/>
    <path class="ct-bhappy" d="M130 141 Q154 123 178 137"/><path class="ct-bhappy" d="M222 137 Q246 123 270 141"/>
    <path class="ct-bangry" d="M130 137 L178 157"/><path class="ct-bangry" d="M270 137 L222 157"/>
  </g>
  <g class="ct-eyes">
    <ellipse cx="154" cy="184" rx="23" ry="25" fill="#fff"/><ellipse cx="246" cy="184" rx="23" ry="25" fill="#fff"/>
    <g class="ct-pup"><circle cx="157" cy="189" r="14" fill="#8bbf3a"/><circle cx="249" cy="189" r="14" fill="#8bbf3a"/>
      <circle cx="157" cy="189" r="7.7" fill="#1c1410"/><circle cx="249" cy="189" r="7.7" fill="#1c1410"/>
      <circle cx="162" cy="183" r="4.9" fill="#fff"/><circle cx="254" cy="183" r="4.9" fill="#fff"/></g>
  </g>
  <g class="ct-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M134 190 Q154 168 174 190"/><path d="M226 190 Q246 168 266 190"/></g>
  <path class="ct-norm" d="M178 256 Q200 274 222 256" fill="none" stroke="#b35a6a" stroke-width="6" stroke-linecap="round"/>
  <g class="ct-talk"><g class="ct-talkin"><ellipse cx="200" cy="262" rx="18" ry="14" fill="#b35a6a"/><ellipse cx="200" cy="269" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="ct-happy"><path d="M170 250 Q200 296 230 250 Z" fill="#b35a6a"/><path d="M178 252 L222 252 L218 259 L182 259 Z" fill="#fff"/><ellipse cx="200" cy="276" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="ct-angry"><path d="M178 272 Q200 248 222 272 Q200 262 178 272 Z" fill="#b35a6a"/><path d="M188 266 L212 266" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="ct-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="ct-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <g class="ct-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#f4f1ec" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#fbf9f6"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="ct-armr">
    <path d="M292 344 C306 362 300 384 276 386" fill="none" stroke="#f4f1ec" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="272" cy="384" rx="18" ry="15" fill="#fbf9f6"/>
    <path d="M282 378 q-5 -3 -10 0 M279 386 q-5 -3 -10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</g>
</svg>
