<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="cp">
<!-- «capybara» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.cp-body{transform-origin:200px 400px;animation:cpSway 5s ease-in-out infinite}
@keyframes cpSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.cp-eyes{transform-origin:200px 146px;animation:cpBlink 4.4s infinite}
@keyframes cpBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.cp-pup{animation:cpLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes cpLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.cp-earl{transform-origin:140px 110px;animation:cpEar 3.6s ease-in-out infinite}
.cp-earr{transform-origin:260px 110px;animation:cpEar 3.6s ease-in-out infinite reverse}
@keyframes cpEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.cp-armr{transform-origin:292px 344px;animation:cpWave 2.8s ease-in-out infinite}
@keyframes cpWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-10deg)}}
.cp-arml{transform-origin:108px 344px;animation:cpRest 3.6s ease-in-out infinite}
@keyframes cpRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.cp-happy,.cp-angry,.cp-bhappy,.cp-bangry,.cp-eyeshappy,.cp-steam,.cp-red,.cp-talk,.cp-spark{opacity:0}
.cp-happy,.cp-angry,.cp-norm,.cp-talk{transition:opacity .2s}
.mood-happy .cp-norm,.mood-happy .cp-bnorm,.mood-happy .cp-eyes{opacity:0}
.mood-happy .cp-happy,.mood-happy .cp-bhappy,.mood-happy .cp-eyeshappy,.mood-happy .cp-spark{opacity:1}
.mood-happy .cp-body{animation:cpJump .55s ease-in-out infinite}
@keyframes cpJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .cp-blush{opacity:.8}
.mood-happy .cp-armr{animation:cpCheer .55s ease-in-out infinite}
@keyframes cpCheer{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}
.mood-happy .cp-arml{animation:cpCheerL .55s ease-in-out infinite}
@keyframes cpCheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.cp-spark{animation:cpSpark 1.2s ease-in-out infinite}
@keyframes cpSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .cp-norm,.mood-angry .cp-bnorm{opacity:0}
.mood-angry .cp-angry,.mood-angry .cp-bangry,.mood-angry .cp-steam{opacity:1}
.mood-angry .cp-red{opacity:.35}
.mood-angry .cp-body{animation:cpShake .18s linear infinite}
@keyframes cpShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .cp-pup{animation:none;transform:translate(0,3px)}
.mood-angry .cp-earl{animation:none;transform:rotate(-18deg)}.mood-angry .cp-earr{animation:none;transform:rotate(18deg)}
.mood-angry .cp-armr{animation:cpFist .3s ease-in-out infinite}
@keyframes cpFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.cp-steam{animation:cpSteam 1.4s ease-out infinite}
@keyframes cpSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .cp-pup{animation:none;transform:translate(7px,-7px)}
.thinking .cp-armr{animation:none;transform:rotate(-34deg) translate(-26px,14px)}
.talking:not(.mood-happy):not(.mood-angry) .cp-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .cp-talk{opacity:1}
.cp-talkin{transform-origin:200px 268px;animation:cpTalk .32s ease-in-out infinite alternate}
@keyframes cpTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .cp-body{animation:cpPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes cpPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .cp-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .cp-bnorm{opacity:0}.poked .cp-bhappy{opacity:1;transform:translateY(-8px)}
.poked .cp-norm{opacity:0}.poked .cp-talk{opacity:1}.poked .cp-talkin{animation:none}
.poked .cp-earl{animation:none;transform:rotate(12deg)}.poked .cp-earr{animation:none;transform:rotate(-12deg)}
</style>
<g class="cp-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#9b6a42"/>
  <path d="M146 400 C150 360 172 338 200 336 C228 338 250 360 254 400 Z" fill="#c69a72"/>
  <g class="cp-earl"><ellipse cx="116" cy="96" rx="22" ry="18" fill="#7d5233"/><ellipse cx="116" cy="98" rx="11" ry="9" fill="#5a3a22"/></g>
  <g class="cp-earr"><ellipse cx="284" cy="96" rx="22" ry="18" fill="#7d5233"/><ellipse cx="284" cy="98" rx="11" ry="9" fill="#5a3a22"/></g>
  <path d="M96 150 C96 96 140 76 200 76 C260 76 304 96 304 150 L306 236 C306 296 262 318 200 318 C138 318 94 296 94 236 Z" fill="#a8744a"/>
  <path d="M120 96 C150 84 250 84 280 96" fill="none" stroke="#c08a5c" stroke-width="10" stroke-linecap="round" opacity=".6"/>
  <ellipse class="cp-red" cx="200" cy="200" rx="104" ry="112" fill="#ff3b30"/>
  <path d="M122 214 C122 188 156 178 200 178 C244 178 278 188 278 214 L278 252 C278 292 244 310 200 310 C156 310 122 292 122 252 Z" fill="#b98a60"/>
  <ellipse cx="176" cy="216" rx="11" ry="8" fill="#3a2414"/><ellipse cx="224" cy="216" rx="11" ry="8" fill="#3a2414"/>
  <ellipse class="cp-blush" cx="114" cy="176" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="cp-blush" cx="286" cy="176" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#5a3a22" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="cp-bnorm" d="M120 112 Q144 100 168 110"/><path class="cp-bnorm" d="M232 110 Q256 100 280 112"/>
    <path class="cp-bhappy" d="M120 106 Q144 88 168 102"/><path class="cp-bhappy" d="M232 102 Q256 88 280 106"/>
    <path class="cp-bangry" d="M120 102 L168 122"/><path class="cp-bangry" d="M280 102 L232 122"/>
  </g>
  <g class="cp-eyes">
    <ellipse cx="144" cy="146" rx="20" ry="22" fill="#fff"/><ellipse cx="256" cy="146" rx="20" ry="22" fill="#fff"/>
    <g class="cp-pup"><circle cx="147" cy="151" r="11" fill="#3a2414"/><circle cx="259" cy="151" r="11" fill="#3a2414"/>
      <circle cx="147" cy="151" r="6.1" fill="#1c1410"/><circle cx="259" cy="151" r="6.1" fill="#1c1410"/>
      <circle cx="152" cy="145" r="4.0" fill="#fff"/><circle cx="264" cy="145" r="4.0" fill="#fff"/></g>
  </g>
  <g class="cp-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M124 152 Q144 130 164 152"/><path d="M236 152 Q256 130 276 152"/></g>
  <path class="cp-norm" d="M178 262 Q200 280 222 262" fill="none" stroke="#4a2a14" stroke-width="6" stroke-linecap="round"/>
  <g class="cp-talk"><g class="cp-talkin"><ellipse cx="200" cy="268" rx="18" ry="14" fill="#4a2a14"/><ellipse cx="200" cy="275" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="cp-happy"><path d="M170 256 Q200 302 230 256 Z" fill="#4a2a14"/><path d="M178 258 L222 258 L218 265 L182 265 Z" fill="#fff"/><ellipse cx="200" cy="282" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="cp-angry"><path d="M178 278 Q200 254 222 278 Q200 268 178 278 Z" fill="#4a2a14"/><path d="M188 272 L212 272" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="cp-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="cp-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <g class="cp-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#9b6a42" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#7d5233"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="cp-armr">
    <path d="M292 344 C314 334 326 310 330 290" fill="none" stroke="#9b6a42" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(332 272)">
      <ellipse cx="0" cy="0" rx="20" ry="21" fill="#7d5233"/>
      <g fill="#7d5233"><ellipse cx="-13" cy="-17" rx="7" ry="9"/><ellipse cx="0" cy="-22" rx="7" ry="9"/><ellipse cx="13" cy="-17" rx="7" ry="9"/></g>
      <ellipse cx="0" cy="4" rx="9" ry="8" fill="#5a3a22"/>
      <g fill="#5a3a22"><circle cx="-12" cy="-17" r="3.5"/><circle cx="0" cy="-21" r="3.5"/><circle cx="12" cy="-17" r="3.5"/></g>
    </g>
  </g>
</g>
</svg>
