<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="pd">
<!-- «panda» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.pd-body{transform-origin:200px 400px;animation:pdSway 5s ease-in-out infinite}
@keyframes pdSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.pd-eyes{transform-origin:200px 176px;animation:pdBlink 4.4s infinite}
@keyframes pdBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.pd-pup{animation:pdLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes pdLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.pd-earl{transform-origin:140px 110px;animation:pdEar 3.6s ease-in-out infinite}
.pd-earr{transform-origin:260px 110px;animation:pdEar 3.6s ease-in-out infinite reverse}
@keyframes pdEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.pd-armr{transform-origin:292px 344px;animation:pdWave 2.8s ease-in-out infinite}
@keyframes pdWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-10deg)}}
.pd-arml{transform-origin:108px 344px;animation:pdRest 3.6s ease-in-out infinite}
@keyframes pdRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.pd-armr{display:none}.lg-hero .pd-armr{display:inline}.lg-hero .pd-armrest{display:none}
.pd-happy,.pd-angry,.pd-bhappy,.pd-bangry,.pd-eyeshappy,.pd-steam,.pd-red,.pd-talk,.pd-spark{opacity:0}
.pd-happy,.pd-angry,.pd-norm,.pd-talk{transition:opacity .2s}
.mood-happy .pd-norm,.mood-happy .pd-bnorm,.mood-happy .pd-eyes{opacity:0}
.mood-happy .pd-happy,.mood-happy .pd-bhappy,.mood-happy .pd-eyeshappy,.mood-happy .pd-spark{opacity:1}
.mood-happy .pd-body{animation:pdJump .55s ease-in-out infinite}
@keyframes pdJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .pd-blush{opacity:.8}
.mood-happy .pd-armr{animation:pdCheer .55s ease-in-out infinite}
@keyframes pdCheer{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}
.mood-happy .pd-arml{animation:pdCheerL .55s ease-in-out infinite}
@keyframes pdCheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.pd-spark{animation:pdSpark 1.2s ease-in-out infinite}
@keyframes pdSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .pd-norm,.mood-angry .pd-bnorm{opacity:0}
.mood-angry .pd-angry,.mood-angry .pd-bangry,.mood-angry .pd-steam{opacity:1}
.mood-angry .pd-red{opacity:.35}
.mood-angry .pd-body{animation:pdShake .18s linear infinite}
@keyframes pdShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .pd-pup{animation:none;transform:translate(0,3px)}
.mood-angry .pd-earl{animation:none;transform:rotate(-18deg)}.mood-angry .pd-earr{animation:none;transform:rotate(18deg)}
.mood-angry .pd-armr{animation:pdFist .3s ease-in-out infinite}
@keyframes pdFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.pd-steam{animation:pdSteam 1.4s ease-out infinite}
@keyframes pdSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .pd-pup{animation:none;transform:translate(7px,-7px)}
.thinking .pd-armr{animation:none;transform:rotate(-34deg) translate(-26px,14px)}
.talking:not(.mood-happy):not(.mood-angry) .pd-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .pd-talk{opacity:1}
.pd-talkin{transform-origin:200px 262px;animation:pdTalk .32s ease-in-out infinite alternate}
@keyframes pdTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .pd-body{animation:pdPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes pdPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .pd-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .pd-bnorm{opacity:0}.poked .pd-bhappy{opacity:1;transform:translateY(-8px)}
.poked .pd-norm{opacity:0}.poked .pd-talk{opacity:1}.poked .pd-talkin{animation:none}
.poked .pd-earl{animation:none;transform:rotate(12deg)}.poked .pd-earr{animation:none;transform:rotate(-12deg)}
</style>
<g class="pd-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#23232a"/>
  <path d="M140 400 C144 356 170 332 200 330 C230 332 256 356 260 400 Z" fill="#f7f7f5"/>
  <path d="M252 318 l26 -60 M262 318 l30 -54" stroke="#7cb342" stroke-width="7" stroke-linecap="round"/><ellipse cx="292" cy="258" rx="14" ry="6" fill="#8bc34a" transform="rotate(-40 292 258)"/>
  <g class="pd-earl"><circle cx="114" cy="104" r="32" fill="#23232a"/></g>
  <g class="pd-earr"><circle cx="286" cy="104" r="32" fill="#23232a"/></g>
  <path d="M90 192 C90 122 140 88 200 88 C260 88 310 122 310 192 C310 264 262 306 200 306 C138 306 90 264 90 192 Z" fill="#f7f7f5" stroke="#dcdcd8" stroke-width="3"/>
  <ellipse class="pd-red" cx="200" cy="196" rx="106" ry="106" fill="#ff3b30"/>
  <ellipse cx="152" cy="178" rx="36" ry="30" fill="#23232a" transform="rotate(-24 152 178)"/><ellipse cx="248" cy="178" rx="36" ry="30" fill="#23232a" transform="rotate(24 248 178)"/>
  <ellipse cx="200" cy="244" rx="38" ry="28" fill="#fff"/>
  <ellipse cx="200" cy="226" rx="14" ry="10" fill="#23232a"/>
  <path d="M200 236 v10" stroke="#23232a" stroke-width="4" stroke-linecap="round"/>
  <ellipse class="pd-blush" cx="110" cy="222" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="pd-blush" cx="290" cy="222" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#23232a" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="pd-bnorm" d="M128 145 Q152 133 176 143"/><path class="pd-bnorm" d="M224 143 Q248 133 272 145"/>
    <path class="pd-bhappy" d="M128 139 Q152 121 176 135"/><path class="pd-bhappy" d="M224 135 Q248 121 272 139"/>
    <path class="pd-bangry" d="M128 135 L176 155"/><path class="pd-bangry" d="M272 135 L224 155"/>
  </g>
  <g class="pd-eyes">
    <ellipse cx="152" cy="176" rx="17" ry="19" fill="#fff"/><ellipse cx="248" cy="176" rx="17" ry="19" fill="#fff"/>
    <g class="pd-pup"><circle cx="155" cy="181" r="11" fill="#3a2a1a"/><circle cx="251" cy="181" r="11" fill="#3a2a1a"/>
      <circle cx="155" cy="181" r="6.1" fill="#1c1410"/><circle cx="251" cy="181" r="6.1" fill="#1c1410"/>
      <circle cx="160" cy="175" r="4.0" fill="#fff"/><circle cx="256" cy="175" r="4.0" fill="#fff"/></g>
  </g>
  <g class="pd-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M132 182 Q152 160 172 182"/><path d="M228 182 Q248 160 268 182"/></g>
  <path class="pd-norm" d="M180 256 Q200 274 220 256" fill="none" stroke="#3a2a2a" stroke-width="6" stroke-linecap="round"/>
  <g class="pd-talk"><g class="pd-talkin"><ellipse cx="200" cy="262" rx="18" ry="14" fill="#3a2a2a"/><ellipse cx="200" cy="269" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="pd-happy"><path d="M172 250 Q200 296 228 250 Z" fill="#3a2a2a"/><path d="M180 252 L220 252 L216 259 L184 259 Z" fill="#fff"/><ellipse cx="200" cy="276" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="pd-angry"><path d="M180 272 Q200 248 220 272 Q200 262 180 272 Z" fill="#3a2a2a"/><path d="M190 266 L210 266" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="pd-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="pd-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <g class="pd-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#23232a" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#33333b"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="pd-armrest">
    <path d="M292 344 C306 362 300 384 276 386" fill="none" stroke="#23232a" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="272" cy="384" rx="18" ry="15" fill="#33333b"/>
  </g>
  <g class="pd-armr">
    <path d="M292 344 C314 334 326 310 330 290" fill="none" stroke="#23232a" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(332 272)">
      <ellipse cx="0" cy="0" rx="20" ry="21" fill="#33333b"/>
      <g fill="#33333b"><ellipse cx="-13" cy="-17" rx="7" ry="9"/><ellipse cx="0" cy="-22" rx="7" ry="9"/><ellipse cx="13" cy="-17" rx="7" ry="9"/></g>
      <ellipse cx="0" cy="4" rx="9" ry="8" fill="#55555e"/>
      <g fill="#55555e"><circle cx="-12" cy="-17" r="3.5"/><circle cx="0" cy="-21" r="3.5"/><circle cx="12" cy="-17" r="3.5"/></g>
    </g>
  </g>
</g>
</svg>
