<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="hm">
<!-- «hamster» — мультяшний суперник (tools/toons.py). Настрій — класом на панелі суперника:
     .mood-happy, .mood-angry, .thinking, .talking, .poked. Без класів — спокійний: кліпає, озирається, махає лапкою. -->
<style>
.hm-body{transform-origin:200px 400px;animation:hmSway 5s ease-in-out infinite}
@keyframes hmSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.hm-eyes{transform-origin:200px 178px;animation:hmBlink 4.4s infinite}
@keyframes hmBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.hm-pup{animation:hmLook 7.5s ease-in-out infinite;transition:transform .3s}
@keyframes hmLook{0%,40%,100%{transform:translate(0,0)}48%,62%{transform:translate(6px,-1px)}70%,80%{transform:translate(-6px,0)}}
.hm-earl{transform-origin:140px 110px;animation:hmEar 3.6s ease-in-out infinite}
.hm-earr{transform-origin:260px 110px;animation:hmEar 3.6s ease-in-out infinite reverse}
@keyframes hmEar{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-8deg)}}
.hm-armr{transform-origin:292px 344px;animation:hmWave 2.8s ease-in-out infinite}
@keyframes hmWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-10deg)}}
.hm-arml{transform-origin:108px 344px;animation:hmRest 3.6s ease-in-out infinite}
@keyframes hmRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.hm-armr{display:none}.lg-hero .hm-armr{display:inline}.lg-hero .hm-armrest{display:none}
.hm-happy,.hm-angry,.hm-bhappy,.hm-bangry,.hm-eyeshappy,.hm-steam,.hm-red,.hm-talk,.hm-spark{opacity:0}
.hm-happy,.hm-angry,.hm-norm,.hm-talk{transition:opacity .2s}
.mood-happy .hm-norm,.mood-happy .hm-bnorm,.mood-happy .hm-eyes{opacity:0}
.mood-happy .hm-happy,.mood-happy .hm-bhappy,.mood-happy .hm-eyeshappy,.mood-happy .hm-spark{opacity:1}
.mood-happy .hm-body{animation:hmJump .55s ease-in-out infinite}
@keyframes hmJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mood-happy .hm-blush{opacity:.8}
.mood-happy .hm-armr{animation:hmCheer .55s ease-in-out infinite}
@keyframes hmCheer{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}
.mood-happy .hm-arml{animation:hmCheerL .55s ease-in-out infinite}
@keyframes hmCheerL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.hm-spark{animation:hmSpark 1.2s ease-in-out infinite}
@keyframes hmSpark{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mood-angry .hm-norm,.mood-angry .hm-bnorm{opacity:0}
.mood-angry .hm-angry,.mood-angry .hm-bangry,.mood-angry .hm-steam{opacity:1}
.mood-angry .hm-red{opacity:.35}
.mood-angry .hm-body{animation:hmShake .18s linear infinite}
@keyframes hmShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mood-angry .hm-pup{animation:none;transform:translate(0,3px)}
.mood-angry .hm-earl{animation:none;transform:rotate(-18deg)}.mood-angry .hm-earr{animation:none;transform:rotate(18deg)}
.mood-angry .hm-armr{animation:hmFist .3s ease-in-out infinite}
@keyframes hmFist{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
.hm-steam{animation:hmSteam 1.4s ease-out infinite}
@keyframes hmSteam{0%{transform:translateY(8px) scale(.6)}100%{transform:translateY(-28px) scale(1.3)}}
.thinking .hm-pup{animation:none;transform:translate(7px,-7px)}
.thinking .hm-armr{animation:none;transform:rotate(-34deg) translate(-26px,14px)}
.talking:not(.mood-happy):not(.mood-angry) .hm-norm{opacity:0}
.talking:not(.mood-happy):not(.mood-angry) .hm-talk{opacity:1}
.hm-talkin{transform-origin:200px 266px;animation:hmTalk .32s ease-in-out infinite alternate}
@keyframes hmTalk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.poked .hm-body{animation:hmPoke .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes hmPoke{0%{transform:scale(1,1)}20%{transform:scale(1.08,.9) translateY(10px)}50%{transform:scale(.95,1.08) translateY(-18px)}100%{transform:none}}
.poked .hm-pup{animation:none;transform:scale(.7);transform-box:fill-box;transform-origin:center}
.poked .hm-bnorm{opacity:0}.poked .hm-bhappy{opacity:1;transform:translateY(-8px)}
.poked .hm-norm{opacity:0}.poked .hm-talk{opacity:1}.poked .hm-talkin{animation:none}
.poked .hm-earl{animation:none;transform:rotate(12deg)}.poked .hm-earr{animation:none;transform:rotate(-12deg)}
</style>
<g class="hm-body">
  <path d="M84 400 C88 344 132 312 200 310 C268 312 312 344 316 400 Z" fill="#e0a25e"/>
  <path d="M140 400 C144 356 170 332 200 330 C230 332 256 356 260 400 Z" fill="#fff4e4"/>
  <g class="hm-earl"><circle cx="112" cy="116" r="30" fill="#d38c45"/><circle cx="112" cy="118" r="17" fill="#f4b3a8"/></g>
  <g class="hm-earr"><circle cx="288" cy="116" r="30" fill="#d38c45"/><circle cx="288" cy="118" r="17" fill="#f4b3a8"/></g>
  <ellipse cx="200" cy="200" rx="116" ry="106" fill="#e8a862"/>
  <ellipse class="hm-red" cx="200" cy="204" rx="112" ry="102" fill="#ff3b30"/>
  <ellipse cx="136" cy="238" rx="54" ry="44" fill="#fff4e4"/><ellipse cx="264" cy="238" rx="54" ry="44" fill="#fff4e4"/>
  <ellipse cx="200" cy="246" rx="44" ry="36" fill="#fff4e4"/>
  <ellipse cx="200" cy="228" rx="10" ry="7" fill="#e5737a"/>
  <path d="M200 236 v8" stroke="#8a4a3a" stroke-width="3" stroke-linecap="round"/>
  <!-- ковбойський капелюх -->
  <g>
    <ellipse cx="200" cy="112" rx="132" ry="24" fill="#6b3f1f"/>
    <path d="M136 112 C136 58 158 36 184 46 C192 50 208 50 216 46 C242 36 264 58 264 112 Z" fill="#7d4a24"/>
    <path d="M140 96 C170 104 230 104 260 96 L262 110 C230 118 170 118 138 110 Z" fill="#3d2412"/>
    <path d="M200 50 v44" stroke="#5e3619" stroke-width="4" stroke-linecap="round" opacity=".6"/>
    <path d="M78 108 C92 128 124 132 150 124 M322 108 C308 128 276 132 250 124" fill="none" stroke="#5e3619" stroke-width="5" stroke-linecap="round"/>
  </g>
  <ellipse class="hm-blush" cx="106" cy="222" rx="20" ry="11" fill="#f08a7e" opacity=".45"/><ellipse class="hm-blush" cx="294" cy="222" rx="20" ry="11" fill="#f08a7e" opacity=".45"/>
  <g stroke="#8a4a22" stroke-width="8" stroke-linecap="round" fill="none">
    <path class="hm-bnorm" d="M130 146 Q154 134 178 144"/><path class="hm-bnorm" d="M222 144 Q246 134 270 146"/>
    <path class="hm-bhappy" d="M130 140 Q154 122 178 136"/><path class="hm-bhappy" d="M222 136 Q246 122 270 140"/>
    <path class="hm-bangry" d="M130 136 L178 156"/><path class="hm-bangry" d="M270 136 L222 156"/>
  </g>
  <g class="hm-eyes">
    <ellipse cx="154" cy="178" rx="18" ry="20" fill="#fff"/><ellipse cx="246" cy="178" rx="18" ry="20" fill="#fff"/>
    <g class="hm-pup"><circle cx="157" cy="183" r="11" fill="#2b1a10"/><circle cx="249" cy="183" r="11" fill="#2b1a10"/>
      <circle cx="157" cy="183" r="6.1" fill="#1c1410"/><circle cx="249" cy="183" r="6.1" fill="#1c1410"/>
      <circle cx="162" cy="177" r="4.0" fill="#fff"/><circle cx="254" cy="177" r="4.0" fill="#fff"/></g>
  </g>
  <g class="hm-eyeshappy" stroke="#2b1a10" stroke-width="8" stroke-linecap="round" fill="none"><path d="M134 184 Q154 162 174 184"/><path d="M226 184 Q246 162 266 184"/></g>
  <path class="hm-norm" d="M180 260 Q200 278 220 260" fill="none" stroke="#8a3a3a" stroke-width="6" stroke-linecap="round"/>
  <g class="hm-talk"><g class="hm-talkin"><ellipse cx="200" cy="266" rx="18" ry="14" fill="#8a3a3a"/><ellipse cx="200" cy="273" rx="10" ry="5" fill="#e5645a"/></g></g>
  <g class="hm-happy"><path d="M172 254 Q200 300 228 254 Z" fill="#8a3a3a"/><path d="M180 256 L220 256 L216 263 L184 263 Z" fill="#fff"/><ellipse cx="200" cy="280" rx="14" ry="6" fill="#e5645a"/></g>
  <g class="hm-angry"><path d="M180 276 Q200 252 220 276 Q200 266 180 276 Z" fill="#8a3a3a"/><path d="M190 270 L210 270" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  <g class="hm-steam" fill="#fff" opacity=".85"><circle cx="96" cy="104" r="14"/><circle cx="82" cy="86" r="10"/><circle cx="304" cy="104" r="14"/><circle cx="318" cy="86" r="10"/></g>
  <g class="hm-spark" fill="#ffd23f"><path d="M64 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/><path d="M332 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <g class="hm-arml">
    <path d="M108 344 C94 362 100 384 124 386" fill="none" stroke="#e0a25e" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="128" cy="384" rx="18" ry="15" fill="#f4c7a8"/>
    <path d="M118 378 q5 -3 10 0 M121 386 q5 -3 10 0" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="hm-armrest">
    <path d="M292 344 C306 362 300 384 276 386" fill="none" stroke="#e0a25e" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="272" cy="384" rx="18" ry="15" fill="#f4c7a8"/>
  </g>
  <g class="hm-armr">
    <path d="M292 344 C314 334 326 310 330 290" fill="none" stroke="#e0a25e" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(332 272)">
      <ellipse cx="0" cy="0" rx="20" ry="21" fill="#f4c7a8"/>
      <g fill="#f4c7a8"><ellipse cx="-13" cy="-17" rx="7" ry="9"/><ellipse cx="0" cy="-22" rx="7" ry="9"/><ellipse cx="13" cy="-17" rx="7" ry="9"/></g>
      <ellipse cx="0" cy="4" rx="9" ry="8" fill="#e5979a"/>
      <g fill="#e5979a"><circle cx="-12" cy="-17" r="3.5"/><circle cx="0" cy="-21" r="3.5"/><circle cx="12" cy="-17" r="3.5"/></g>
    </g>
  </g>
</g>
</svg>
