<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice">
<!-- Тун-тун-тун-сахур: нічна вуличка — місяць, зірки мерехтять, ліхтарики гойдаються й світяться -->
<style>
.tw{animation:tw 2s ease-in-out infinite}.tw2{animation-delay:-.7s}.tw3{animation-delay:-1.3s}@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.ln{transform-box:fill-box;transform-origin:50% 0;animation:ln 3s ease-in-out infinite}.ln2{animation-delay:-1s}.ln3{animation-delay:-2s}@keyframes ln{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.gw{animation:gw 2.4s ease-in-out infinite}@keyframes gw{0%,100%{opacity:.35}50%{opacity:.6}}
</style>
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1b4a"/><stop offset="1" stop-color="#4a3a7a"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".8"/><stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="320" fill="url(#sk)"/>
<circle cx="120" cy="70" r="34" fill="#fff4c9"/><circle cx="134" cy="62" r="30" fill="#2a2660"/>
<g fill="#fff"><circle class="tw" cx="260" cy="40" r="2.5"/><circle class="tw tw2" cx="340" cy="80" r="2"/><circle class="tw tw3" cx="470" cy="36" r="2.5"/><circle class="tw" cx="600" cy="70" r="2"/><circle class="tw tw2" cx="720" cy="30" r="2.5"/><circle class="tw tw3" cx="40" cy="140" r="2"/></g>
<!-- будиночки -->
<g fill="#2e2a5c"><rect x="0" y="170" width="140" height="150"/><rect x="130" y="140" width="120" height="180"/><rect x="560" y="150" width="120" height="170"/><rect x="670" y="180" width="130" height="140"/></g>
<g fill="#ffd27a" opacity=".85"><rect x="30" y="200" width="22" height="26" rx="3"/><rect x="80" y="200" width="22" height="26" rx="3"/><rect x="160" y="170" width="22" height="26" rx="3"/><rect x="600" y="180" width="22" height="26" rx="3"/><rect x="710" y="210" width="22" height="26" rx="3"/></g>
<!-- мотузка з ліхтариками -->
<path d="M0 40 Q400 130 800 40" fill="none" stroke="#6b5a8a" stroke-width="3"/>
<g><circle class="gw" cx="220" cy="120" r="46" fill="url(#gl)"/><circle class="gw" cx="400" cy="150" r="50" fill="url(#gl)"/><circle class="gw" cx="580" cy="120" r="46" fill="url(#gl)"/></g>
<g class="ln"><line x1="220" y1="78" x2="220" y2="92" stroke="#6b5a8a" stroke-width="3"/><ellipse cx="220" cy="116" rx="22" ry="26" fill="#ff6b4a"/><rect x="208" y="88" width="24" height="6" rx="2" fill="#8a3a2a"/><rect x="208" y="138" width="24" height="6" rx="2" fill="#8a3a2a"/><path d="M220 96v40M206 102q14 14 0 30M234 102q-14 14 0 30" stroke="#c94a32" stroke-width="2" fill="none"/></g>
<g class="ln ln2"><line x1="400" y1="85" x2="400" y2="120" stroke="#6b5a8a" stroke-width="3"/><ellipse cx="400" cy="146" rx="24" ry="28" fill="#ffb13b"/><rect x="386" y="116" width="28" height="6" rx="2" fill="#9a5a1a"/><rect x="386" y="170" width="28" height="6" rx="2" fill="#9a5a1a"/><path d="M400 124v44M385 130q15 16 0 32M415 130q-15 16 0 32" stroke="#d98a1c" stroke-width="2" fill="none"/></g>
<g class="ln ln3"><line x1="580" y1="78" x2="580" y2="92" stroke="#6b5a8a" stroke-width="3"/><ellipse cx="580" cy="116" rx="22" ry="26" fill="#ff5c9a"/><rect x="568" y="88" width="24" height="6" rx="2" fill="#8a2a5a"/><rect x="568" y="138" width="24" height="6" rx="2" fill="#8a2a5a"/><path d="M580 96v40M566 102q14 14 0 30M594 102q-14 14 0 30" stroke="#c9407a" stroke-width="2" fill="none"/></g>
<!-- бруківка -->
<rect x="0" y="262" width="800" height="58" fill="#3a3466"/>
<g fill="#4a4480"><rect x="10" y="272" width="60" height="16" rx="6"/><rect x="90" y="292" width="60" height="16" rx="6"/><rect x="200" y="274" width="60" height="16" rx="6"/><rect x="320" y="294" width="60" height="16" rx="6"/><rect x="440" y="272" width="60" height="16" rx="6"/><rect x="560" y="292" width="60" height="16" rx="6"/><rect x="680" y="274" width="60" height="16" rx="6"/></g>
</svg>
