<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice">
<!-- Кіт Смадж: затишна кухня — плитка, вікно з хмаринкою, лампа гойдається, стіл із тарілкою овочів -->
<style>
.lp{transform-origin:250px 0;animation:lp 4s ease-in-out infinite}@keyframes lp{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.cl{animation:cl 18s linear infinite}@keyframes cl{from{transform:translateX(-60px)}to{transform:translateX(120px)}}
</style>
<defs><pattern id="tl" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fff4e0"/><rect width="20" height="20" fill="#ffe6c2"/><rect x="20" y="20" width="20" height="20" fill="#ffe6c2"/></pattern>
<clipPath id="win"><rect x="560" y="50" width="170" height="120" rx="10"/></clipPath></defs>
<rect width="800" height="320" fill="url(#tl)"/>
<rect x="0" y="0" width="800" height="40" fill="#f3c98f"/>
<!-- вікно -->
<rect x="552" y="42" width="186" height="136" rx="14" fill="#fff"/>
<g clip-path="url(#win)"><rect x="560" y="50" width="170" height="120" fill="#9fdcff"/><g class="cl" fill="#fff"><ellipse cx="620" cy="100" rx="30" ry="12"/><ellipse cx="642" cy="92" rx="20" ry="10"/></g></g>
<path d="M645 50v120M560 110h170" stroke="#fff" stroke-width="8"/>
<!-- полиця з баночками -->
<rect x="70" y="92" width="200" height="10" rx="4" fill="#c98f55"/>
<g><rect x="90" y="58" width="30" height="34" rx="6" fill="#ff8a8a"/><rect x="132" y="50" width="34" height="42" rx="6" fill="#8fd18a"/><rect x="180" y="62" width="28" height="30" rx="6" fill="#ffd166"/><rect x="220" y="54" width="32" height="38" rx="6" fill="#9fb8ff"/></g>
<!-- лампа -->
<g class="lp"><line x1="250" y1="0" x2="250" y2="60" stroke="#6b4a3a" stroke-width="4"/><path d="M216 60 h68 l-12 30 h-44 z" fill="#ff9f1c"/><ellipse cx="250" cy="92" rx="14" ry="6" fill="#fff7c2"/></g>
<!-- стіл -->
<rect x="0" y="250" width="800" height="70" fill="#c98f55"/><rect x="0" y="244" width="800" height="12" fill="#e0a86a"/>
<!-- тарілка з овочами -->
<ellipse cx="140" cy="258" rx="70" ry="16" fill="#fff"/><ellipse cx="140" cy="254" rx="52" ry="10" fill="#e8f7e2"/>
<g><circle cx="118" cy="248" r="10" fill="#4caf50"/><circle cx="134" cy="244" r="12" fill="#66bb6a"/><circle cx="156" cy="248" r="8" fill="#e53935"/><circle cx="168" cy="246" r="7" fill="#ffca28"/></g>
<!-- чашка -->
<rect x="640" y="222" width="38" height="30" rx="8" fill="#7c6cf0"/><path d="M678 230 q14 0 14 10 q0 10 -14 10" fill="none" stroke="#7c6cf0" stroke-width="6"/>
</svg>
