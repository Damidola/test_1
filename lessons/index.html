<body data-asset-url=".">
  <main id="main-wrap"><div id="learn-app"></div></main>
  <script src="../shared/games.js?v=1790422147"></script>
  <script src="../shared/kit.js?v=1790422147" data-game="learn" data-night="on"></script>
  <style>

  <script src="../shared/vid.js?v=1790422147"></script>
  <script>
    // Відео-знайомство з фігурою. Поки воно на екрані, урок ще не завантажений — дошка з'являється лише після «До вправ».
    (function () {
      const V = {
        12: ['1a9bI3uKS0Y', 'Що таке мат?', 'Мат — це шах, від якого нікуди подітися: не втекти, не закритися й не побити. Хто поставив мат — той виграв!'],
        13: ['goCi5upaxmk', 'Початок гри', 'Як стоять фігури на початку партії і які перші ходи роблять сильні шахісти.'],
        14: ['3xmrKrsTTtw', 'Як зробити рокіровку?', 'Король стрибає на дві клітинки до тури, а тура перескакує через нього. Можна, якщо король і тура ще не ходили, між ними порожньо і королю не шах.'],
        15: ['xwNtd8XqLME', 'Особливі пішаки', 'Пішак, який стрибнув на дві клітинки повз твого пішака, можна побити «на проході» — ніби він пішов лише на одну.']
      };
      const stage = () => (location.hash.match(/^#\/(\d+)/) || [])[1];
      const start = () => import('./app.js?v=1790422147');
      const s0 = stage(), v = V[s0];
      if (!v) start();
      else document.addEventListener('DOMContentLoaded', () => {
        LGVideo.overlay(v, start);
      });
      // «Далі» веде до уроку іншої фігури — відкриваємо його заново, щоб спершу показати її відео
      let cur = s0;
      addEventListener('hashchange', () => { const s = stage(); if (s === cur) return; cur = s; if (V[s]) location.replace(location.pathname + '?n=' + Date.now() + location.hash); });
    })();
  </script>

</body>
</html>
