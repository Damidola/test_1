<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>20 задач · мат в 1 хід</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.2.0/assets/chessground.base.css">
<link rel="stylesheet" href="../shared/vendor/lichess-board.css?v=1791644070">
<link rel="stylesheet" href="lab.css?v=1791644070">
</head>
<body>
<main>
<header><a href="../index.html#practice" aria-label="Назад до задач">‹</a><h1>Мат в 1 хід</h1><span id="pieces"></span></header>
<nav class="task-nav" aria-label="Вибір задачі"><button id="prev" aria-label="Попередня задача">‹</button><button id="count" aria-haspopup="dialog">1 / 20</button><button id="next" aria-label="Наступна задача">›</button></nav>
<p id="goal">Завантаження…</p>
<div class="board-slot"><div id="board-wrap" class="lg-board-wrap" data-fit="1"><div id="board" class="cg-wrap"></div></div></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="controls"><button id="hint">Підказка</button><button id="answer">Рішення</button><button id="restart">Знову</button></div>
</main>
<dialog id="tasks"><div class="dialog-head"><h2>Вибери задачу</h2><button id="close-tasks" aria-label="Закрити список">×</button></div><div id="picker" aria-label="Список задач"></div></dialog>
<dialog id="promotion"><h2>На яку фігуру?</h2><div><button data-role="queen">Ферзь</button><button data-role="rook">Тура</button><button data-role="bishop">Слон</button><button data-role="knight">Кінь</button></div></dialog>
<script type="module" src="lab.js?v=1791644070"></script>
</body>
</html>
